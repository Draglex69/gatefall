# Builds Gatefall on every push to main:
#   1. website + online rooms -> Cloudflare Worker (needs the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets)
#   2. Android APK (always) and a Play Store .aab, both signed with your key when the ANDROID_KEYSTORE_* secrets exist
#      -> attached to a GitHub Release "v<GAME_VERSION>" and kept as a workflow artifact
name: Release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: release
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    outputs:
      url: ${{ steps.url.outputs.url }}
      version: ${{ steps.ver.outputs.version }}
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - id: ver
        run: echo "version=$(grep -oP 'const GAME_VERSION = \K\d+' index.html)" >> "$GITHUB_OUTPUT"
      - name: Build the website
        run: node scripts/build-app.mjs --platform web
      - name: Web files for any host (GitHub Pages, itch.io, ...)
        uses: actions/upload-artifact@v4
        with: { name: web, path: build/web }
      - uses: actions/upload-pages-artifact@v3
        with: { path: build/web }
      - name: Rules tests
        run: |
          node tests/gatefall-v47-monster-lp.cjs
          node tests/gatefall-v50-double.cjs
      - name: Deploy to Cloudflare
        id: deploy
        if: env.CF_TOKEN != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          workingDirectory: worker
          command: deploy --var GAME_VERSION:${{ steps.ver.outputs.version }}
      - id: url
        run: |
          URL="${{ vars.GATEFALL_URL }}"
          [ -z "$URL" ] && URL="${{ steps.deploy.outputs.deployment-url }}"
          echo "url=${URL%/}" >> "$GITHUB_OUTPUT"
          if [ -n "$URL" ]; then echo "### Play online: $URL" >> "$GITHUB_STEP_SUMMARY"; else echo "### Website not deployed: add the Cloudflare secrets (see PUBLISHING.md)" >> "$GITHUB_STEP_SUMMARY"; fi

  # the web version on GitHub Pages: https://draglex69.github.io/gatefall/
  # needs Settings -> Pages -> Source: "GitHub Actions" (free for public repositories; private ones need GitHub Pro)
  pages:
    needs: web
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions: { pages: write, id-token: write }
    environment: { name: github-pages, url: "${{ steps.deploy.outputs.page_url }}" }
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
      - run: |
          echo "### Play in the browser: ${{ steps.deploy.outputs.page_url }}" >> "$GITHUB_STEP_SUMMARY"

  android:
    needs: web
    runs-on: ubuntu-latest
    env:
      V: ${{ needs.web.outputs.version }}
      URL: ${{ needs.web.outputs.url }}
      KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: Game files for the app
        run: |
          ARGS="--platform android"
          [ -n "$URL" ] && ARGS="$ARGS --server $URL --web $URL"
          node scripts/build-app.mjs $ARGS
      - name: Android project (Capacitor)
        working-directory: platforms/mobile
        run: |
          npm install --no-audit --no-fund
          npx cap add android
          npx capacitor-assets generate --android --iconBackgroundColor '#0c1117' --iconBackgroundColorDark '#0c1117' --splashBackgroundColor '#0c1117' --splashBackgroundColorDark '#0c1117'
          npx cap sync android
          sed -i -E "s/versionCode [0-9]+/versionCode $V/; s/versionName \"[^\"]*\"/versionName \"1.0.$V\"/" android/app/build.gradle
          # edge-to-edge, as Capacitor recommends for Android 15/16
          MA=$(find android/app/src/main/java -name MainActivity.java)
          PKG=$(sed -n 's/^package \(.*\);/\1/p' "$MA")
          printf 'package %s;\n\nimport android.os.Bundle;\nimport androidx.activity.EdgeToEdge;\nimport com.getcapacitor.BridgeActivity;\n\npublic class MainActivity extends BridgeActivity {\n  @Override\n  protected void onCreate(Bundle savedInstanceState) {\n    EdgeToEdge.enable(this);\n    super.onCreate(savedInstanceState);\n  }\n}\n' "$PKG" > "$MA"
      - name: Build
        working-directory: platforms/mobile/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease bundleRelease
      - name: Sign
        working-directory: platforms/mobile
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          mkdir -p ../../out
          if [ -n "$KS_B64" ]; then
            # your own key (repository secrets): every new APK installs over the last one, and the .aab is ready for Play
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/key.jks"
          else
            # no key yet: a throwaway key for this build only (uninstall the old app before installing a new APK)
            KS_PASS=temp-pass KEY_PASS=temp-pass KEY_ALIAS=temp
            keytool -genkeypair -keystore "$RUNNER_TEMP/key.jks" -storepass "$KS_PASS" -keypass "$KEY_PASS" -alias "$KEY_ALIAS" -keyalg RSA -keysize 2048 -validity 365 -dname "CN=Gatefall test build"
            echo "::warning::APK signed with a throwaway key. Add the ANDROID_KEYSTORE_* secrets (PUBLISHING.md) so updates install over each other."
          fi
          "$BT/zipalign" -f -p 4 android/app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign --v4-signing-enabled false --ks "$RUNNER_TEMP/key.jks" --ks-pass env:KS_PASS --ks-key-alias "$KEY_ALIAS" --key-pass env:KEY_PASS --out ../../out/gatefall-v$V.apk "$RUNNER_TEMP/aligned.apk"
          if [ -n "$KS_B64" ]; then
            jarsigner -keystore "$RUNNER_TEMP/key.jks" -storepass:env KS_PASS -keypass:env KEY_PASS -signedjar ../../out/gatefall-v$V.aab android/app/build/outputs/bundle/release/app-release.aab "$KEY_ALIAS"
          fi
          rm -f "$RUNNER_TEMP/key.jks"
      - name: Web version as a zip (upload it to itch.io or any web host)
        uses: actions/download-artifact@v4
        with: { name: web, path: web }
      - run: cd web && zip -qr ../out/gatefall-v$V-web.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: gatefall-v${{ env.V }}-android
          path: out/*
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.V }}
          name: Gatefall v${{ env.V }}
          body: |
            Android: download gatefall-v${{ env.V }}.apk on your phone and open it to install (allow "install unknown apps" for your browser once).
            ${{ env.URL && format('Play in the browser: {0}', env.URL) || 'Website: not deployed yet (add the Cloudflare secrets).' }}
          files: out/*
          make_latest: true
