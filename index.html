// play effects for whatever just happened, based on new log lines
function soundHooks(){
  const total = S.logCount || 0;
  if (ui.logSeen == null || ui.logSeen > total) ui.logSeen = total;
  const fresh = S.log.slice(Math.max(0, S.log.length - (total - ui.logSeen)));
  ui.logSeen = total;
  const kinds = [];
  for (const l of fresh){
    const x = l.text; let k = null;
    if (/^— Turn/.test(x)) k = x.endsWith(`: ${P(S,ME).name} —`) ? "turn" : null;
    else if (/activates? .+!$/.test(x)) k = "trap";
    else if (/activates? /.test(x)) k = "spell";
    else if (/ attacks /.test(x)) k = "attack";
    else if (/is destroyed/.test(x)) k = "destroy";
    else if (/damage\.$/.test(x)) k = "hit";
    else if (/summons? |returns to the field/.test(x)) k = "summon";
    else if (/sets? a (monster|card)/.test(x)) k = "set";
    else if (/gains? \d+ LP/.test(x)) k = "heal";
    else if (/flip/.test(x)) k = "flip";
    if (k && !kinds.includes(k)) kinds.push(k);
    const dm = x.match(/(\d+) damage\.$/);
    if (dm && l.p != null){ popNumber(l.p, "-" + dm[1], false); shake(l.p === ME); }
    const hm = x.match(/gains? (\d+) LP/);
    if (hm && l.p != null) popNumber(l.p, "+" + hm[1], true);
  }
  const animated = fxOn() ? ["spell","trap","summon","attack","flip"] : [];
  kinds.filter(k => !animated.includes(k)).slice(0, 4).forEach((k, n) => Sound.play(k, n * .14));
  if (S.winner != null && !ui.endPlayed){ ui.endPlayed = true; Sound.play(S.winner === ME ? "win" : "lose", .3); }
  Sound.setIntensity(S.winner == null && S.phase === "battle" ? 1 : 0);
}

/* ===================== ONLINE PLAY =====================
   Lockstep for 2–4 players: the host sends a seed, every deck and the seat list; each device
   runs the same engine and the players exchange only their moves (numbered). Only the player
   whose move it is ever sends one, so the numbering never collides. Lost messages are recovered
   by a heartbeat that compares move counts and re-sends what's missing. The host also plays any
   bot seats, and takes over the seat of a player who leaves (or vanishes for a minute). */
let RoomNS = null, roomChecked = false, roomKind = "", roomRetry = null;
/* Two ways to reach other players:
   - "claude": the game is published as a Claude artifact; signed-in people it is shared with talk through
     the artifact's live room (no server needed).
   - "hosted": the game runs on its own Node server, which relays room messages at /api/rooms (anyone with the link).
   Whichever answers first is used; with neither, the lobby explains what is needed. */
async function detectRoomService(){
  try {
    if (window.claude && typeof window.claude.use === "function"){
      const room = await Promise.race([window.claude.use("room"), new Promise(res => setTimeout(() => res(null), 12000))]);
      if (room && typeof room.join === "function"){ roomKind = "claude"; return room; }
    }
  } catch (e){ console.warn("artifact room unavailable", e); }
  try {
    if (GF_CFG.app && !GF_CFG.server) return null;   // an app build without a room server plays offline modes only
    const r = await fetch(roomsUrl("gf-zzzz/leave"), {method:"POST", headers:{"Content-Type":"application/json"}, body:"{}", credentials:ROOM_CREDS});
    const d = await r.json().catch(() => null);
    if (r.ok && d && d.ok === true){ roomKind = "hosted"; return hostedRoomService(); }
  } catch (e){}
  return null;
}
const MAX_SEATS = 4, GONE_MS = 60000;
const netFresh = () => ({r:null, role:null, code:"", gid:null, start:null, acts:[], hashes:[], hb:null, offs:[], connected:false,
  guests:[], botsWanted:0, bots:[], here:new Set(), lobby:null, gone:{}, left:new Set(), status:"",
  rematchAsked:new Set(), rematchSent:false, joinTimer:null, seen:{}, presAt:0, snap:null, repairAt:0, pend:[]});
/* Move order online: the host is the referee. The host's own moves (and its bots') are final at once. A guest plays
   its move immediately on its own screen but sends it as a proposal ("prop"); the host applies it in arrival order
   and broadcasts the final numbered move ("act", auth). If another move got there first, the guest undoes its own,
   takes the winning move, and replays its own on top (the host does the same), so simultaneous moves by partners in
   a shared turn never get lost. Guests keep their unconfirmed moves in Net.pend. */
const confirmedLen = () => Net.acts.length - (Net.role === "host" ? 0 : Net.pend.length);
const Net = Object.assign(netFresh(), {me:""});
const roomFromUrl = href => { try { const v = new URL(href).searchParams.get("room") || ""; return /^[a-z0-9]{4}$/i.test(v) ? v.toLowerCase() : ""; } catch (e) { return ""; } };
let inviteRoom = HAS_DOM ? roomFromUrl(location.href) : "";
const CODE_CHARS = "abcdefghjkmnpqrstuvwxyz23456789";
const rid = n => Array.from({length:n}, () => CODE_CHARS[Math.floor(Math.random() * CODE_CHARS.length)]).join("");
// one id per browser tab (kept across a reload, so you can rejoin your seat)
function myPeerId(){
  if (Net.me) return Net.me;
  let id = "";
  try { id = sessionStorage.getItem("gatefall.pid") || ""; } catch (e) {}
  if (!/^[a-z0-9]{10}$/.test(id)){ id = rid(10); try { sessionStorage.setItem("gatefall.pid", id); } catch (e) {} }
  return Net.me = id;
}

// Same-origin hosted rooms. A small polling relay works on the published game link,
// without Claude, an account, WebSocket support, or any third-party service.
function hostedRoomService(){
  const request = async (room, path, body, keepalive = false) => {
    const r = await fetch(roomsUrl(`${room}/${path}`), {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(body), credentials:ROOM_CREDS, keepalive});
    const data = await r.json().catch(() => ({}));
    if (!r.ok){ const e = new Error(data.error || "Room service unavailable"); e.code = r.status === 401 ? "rejoin" : "network"; throw e; }
    return data;
  };
  return {join:async room => {
    const peerId = myPeerId(), msgHandlers = [], peerHandlers = [], connHandlers = [];
    let clientId = "", since = 0, closed = false, timer = null, polling = false, connected = false, presenceData = {}, peersNow = [], peerSig = "";
    const connection = on => { if (connected === on) return; connected = on; connHandlers.forEach(f => { try { f(on); } catch (e) {} }); };
    const connect = async () => { const d = await request(room, "join", {peerId}); clientId = d.clientId; since = d.since || 0; connection(true); };
    await connect();
    const poll = async () => {
      if (closed || polling) return;
      polling = true;
      try {
        const d = await request(room, "poll", {clientId, since, presence:presenceData});
        since = d.seq;
        for (const m of d.messages || []) if (m.from !== clientId) msgHandlers.forEach(f => { try { f({data:m.data, sameTab:false}); } catch (e) { console.warn(e); } });
        peersNow = (d.peers || []).map(p => ({clientId:p.clientId, presence:p.presence, sameTab:p.clientId === clientId}));
        const sig = JSON.stringify(peersNow);
        if (sig !== peerSig){ peerSig = sig; peerHandlers.forEach(f => { try { f({peers:peersNow}); } catch (e) {} }); }
        connection(true);
      } catch (e) {
        connection(false);
        if (e.code === "rejoin" && !closed){ try { await connect(); } catch (e2) {} }
      } finally {
        polling = false;
        if (!closed) timer = setTimeout(poll, connected ? 450 : 1500);
      }
    };
    timer = setTimeout(poll, 80);
    return {

async function netOpen(role, code){

// the host's bot plays a seat whose player is gone
function takeOver(seat){

function takeAct(n, seat, a, quiet = false, aid = null){

  const backup = JSON.stringify(S);
  takeEv(S);
  let err = apply(S, seat, a);
  if (err){
    console.warn("action rejected while catching up:", err, a);
    S = linkCoopST(JSON.parse(backup)); takeEv(S);   // a rejected network action must be atomic
  }
  Net.acts.push({s:seat, a, aid}); Net.hashes[n + 1] = netHash(S);
  const evs = err || quiet ? (takeEv(S), []) : takeEv(S);   // catching up after a rejoin: no replay of every animation

// a guest takes the host's final move number n
function guestTakeAuth(n, seat, a, aid, h, quiet = false){

  if (n > base){ send({k:"need", gid:Net.gid, from:base}); return; }
  if (Net.pend.length && Net.pend[0].aid === aid){   // our own move, confirmed where we played it
    Net.pend.shift();

    return;

function sendActs(from){

  while (i < end && sent < 12){
    const list = []; let bytes = 120;
    while (i + list.length < end && list.length < 30){
      const b = JSON.stringify(Net.acts[i + list.length]).length + 1;
      if (list.length && bytes + b > 3000) break;
      list.push(Net.acts[i + list.length]); bytes += b;

function heartbeat(){

    {transform:`translate(${dx * reach}px, ${dy * reach}px) rotate(${10 * tilt}deg) scale(1.18)`, offset:.52},
    {transform:`translate(${dx * reach * .8}px, ${dy * reach * .8}px) rotate(${4 * tilt}deg) scale(1.05)`, offset:.64},
    {transform:"translate(0,0) rotate(0deg) scale(1)"},

  rect(sel){ const el = typeof sel === "string" ? document.querySelector(sel) : sel; return el && el.getBoundingClientRect ? el.getBoundingClientRect() : null; },
  ctr(r){ return {x:r.left + r.width / 2, y:r.top + r.height / 2}; },
  zone(kind, owner, slot){ return this.rect(`[data-zone="${kind}:${owner}:${slot}"]`); },
  lp(owner){ const el = lpEl(owner); return el ? el.getBoundingClientRect() : null; },

  side(owner){ const b = this.rect("#gameView"); return b ? {x:b.left + b.width / 2, y:owner === ME ? b.bottom - 30 : b.top + 30} : {x:innerWidth / 2, y:innerHeight / 2}; },
  sprite(spr, scale, x, y, extra = ""){

    const w = spr.w * scale, h = spr.h * scale;

async function fxCard(ev){

  wrap.innerHTML = `<div class="cutin-rays"></div>${bigCard(ev.id)}<div class="cutin-tag">${d.kind === "hero" ? "Duelist special!" : d.kind === "monster" ? (d.handEff ? "Hand trap!" : "Effect!") : d.kind === "trap" ? "Trap card!" : d.quick ? "Quick spell!" : "Spell card!"}</div>`;

  await FXA.anim(wrap, [

    {transform:"translate(-50%,-50%) scale(1.12) rotate(0deg)", opacity:1, offset:.2},
    {transform:"translate(-50%,-50%) scale(1) rotate(0deg)", opacity:1, offset:.28},

    const gy = FXA.rect(`[data-zone="gy:${ev.owner}"]`);
    if (gy && !d.field && !d.continuous) FXA.fly(placed, FXA.ctr(zr), FXA.ctr(gy), 320, {scaleTo:.6}).then(() => placed.remove());
    else placed.remove();
  }
}

const PHASE_NAME = {draw:"Draw Phase", standby:"Standby Phase", main1:"Main Phase 1", battle:"Battle Phase", main2:"Main Phase 2", end:"End Phase"};

/* ---- the director: pre effects, then the attack lunge, then re-render, then post effects ---- */
let fxChain = Promise.resolve();
const fxOn = () => HAS_DOM && !REDUCED && typeof Element !== "undefined" && !!Element.prototype.animate;
function present(info, evs, done){
  let finished = false;
  const finish = () => { if (finished) return; finished = true; try { done(); } catch (e){ console.warn("present", e); } try { flushQueuedDraw(); flushQueuedTap(); } catch (e){ console.warn("draw", e); } };
  if (!fxOn() || !evs.length){ ui.busy = false; finish(); return; }
  // Never build an unbounded animation queue when a burst of network actions arrives.
  // The current animation finishes visually, while the newest rules state renders at once.
  if (ui.busy){ ui.fxUntil = 0; finish(); return; }
  fxChain = fxChain.then(() => direct(info, evs, finish)).catch(e => { console.warn(e); ui.busy = false; finish(); });
}
// an animation step may never hang the game: each one gets a few seconds at most
const fxGuard = (p, ms = 5000) => Promise.race([p, new Promise(r => setTimeout(r, ms))]);
async function direct(info, evs, done){
  ui.busy = true; ui.busySince = Date.now();
  ui.rising = ui.rising || new Set();
  for (const ev of evs) if ((ev.k === "summon" && !ev.set) || ev.k === "revive" || ev.k === "xyz"){ ui.rising.add(ev.uid); seenOnce("st" + ev.uid); }
  document.querySelectorAll(".zone.target,.zone.sel,.zone.spot").forEach(el => el.classList.remove("target", "sel", "spot"));
  let rendered = false;
  const show = () => { if (!rendered){ rendered = true; ui.busy = false; done(); } };
  try {
    for (const ev of evs){
      if (ev.k === "lunge"){ if (!rendered) await fxGuard(new Promise(res => playAttack(ev, () => { show(); res(); }))); continue; }
      if (FX_PRE[ev.k] && !rendered) await fxGuard(Promise.resolve().then(() => FX_PRE[ev.k](ev)));
    }
  } catch (e){ console.warn("fx", e); }
  show();
  let longest = 0;
  for (const ev of evs) if (FX_POST[ev.k]){ try { longest = Math.max(longest, FX_POST[ev.k](ev) || 0); } catch (e){ console.warn("fx", e); } }
  ui.fxUntil = (typeof performance !== "undefined" ? performance.now() : 0) + longest;
}

// watchdog: if the screen has been "busy" far too long, unstick it and redraw (the game state is never at risk)
if (typeof setInterval === "function" && HAS_DOM) setInterval(() => {
  if (ui.busy && ui.busySince && Date.now() - ui.busySince > 12000){
    console.warn("fx watchdog: unsticking the screen"); ui.busy = false; ui.fxUntil = 0; fxChain = Promise.resolve();
    try { render(); pump(); flushQueuedDraw(); } catch (e){ console.warn(e); }
  }
}, 3000);
let botTimer = null;
// seats played by the computer on this device: every other seat in a bot duel, and bot seats the online host runs
function isBotSeat(j){ return ui.match === "bot" ? j !== ME : (ui.match === "online" && Net.role === "host" && (Net.bots || []).includes(j)); }
/* Which bot moves next, and what it does. Teammate bots finish their moves in a shared phase before anyone moves
   the phase on; while a human teammate is still in the turn, bots never move the phase on or ready (the human
   decides). `isBot(seat)` says which seats this device plays; `skip` holds bots whose last move was refused. */
const PHASE_MOVES = ["toBattle", "toMain2", "endTurn"];
function botPlan(S, isBot, skip = null){
  if (!S || S.winner != null) return null;
  if (S.pending) return isBot(S.pending.player) ? {seat:S.pending.player, a:botAction(S, S.pending.player)} : null;
  const dw = S.drawWait || [];
  if (dw.length){ const b = dw.find(j => isBot(j)); return b != null ? {seat:b, a:{t:"draw"}} : null; }
  const team = (paired(S, S.active) ? liveTeam(S, S.active) : [S.active]).filter(j => canAct(S, j));
  const order = [S.active, ...team.filter(j => j !== S.active)].filter(j => team.includes(j));
  const humanIn = order.some(j => !isBot(j));
  const mustBattle = j => S.phase === "main1" && canBattle(S, j) && P(S,j).m.some(z => isBerserk(z));
  let lead = null;
  for (const j of order){
    if (!isBot(j)) continue;
    let a = null; try { a = botAction(S, j); } catch (e){ console.error(e); }
    if (a && a.t === "endTurn" && mustBattle(j)) a = {t:"toBattle"};
    if (a && !PHASE_MOVES.includes(a.t) && !(skip && skip.has(j))) return {seat:j, a};
    if (lead == null) lead = {seat:j, a:a && PHASE_MOVES.includes(a.t) ? a : mustBattle(j) ? {t:"toBattle"} : {t:"endTurn"}};
  }

}
function pump(){
  clearTimeout(botTimer);
  if (!S || S.winner != null || (ui.match !== "bot" && ui.match !== "online")) return;
  const key = S.turn + ":" + S.phase;
  if (ui.botSkipKey !== key){ ui.botSkipKey = key; ui.botSkip = new Set(); }
  if (!botPlan(S, isBotSeat, ui.botSkip)) return;
  const botStep = () => {
    if (!S || S.winner != null) return;
    const left = (ui.fxUntil || 0) - (typeof performance !== "undefined" ? performance.now() : 0);
    if (left > 0 || ui.busy){ botTimer = setTimeout(botStep, Math.max(left, 0) + 250); return; }
    const key = S.turn + ":" + S.phase;
    if (ui.botSkipKey !== key){ ui.botSkipKey = key; ui.botSkip = new Set(); }
    let plan = null; try { plan = botPlan(S, isBotSeat, ui.botSkip); } catch (e){ console.error(e); }
    if (!plan) return;
    const seat = plan.seat, a = plan.a;
    let err = "no action";
    try { err = a ? localAct(seat, a) : "no action"; } catch (e){ console.error(e); }
    if (err){
      const pd = S.pending, real = a && !PHASE_MOVES.includes(a.t) && a.t !== "draw";
      if (real && !(pd && pd.player === seat)){
        // a refused move: this bot sits the rest of the phase out instead of trying the same thing forever
        console.warn("bot move refused:", err, a); ui.botSkip.add(seat);
      } else {
        const fb = pd && pd.player === seat ? (pd.type === "respond" ? {t:"respond", value:null} : {t:"choose", value:pd.options[0].value}) : (S.drawWait||[]).includes(seat) ? {t:"draw"} : canAct(S,seat) ? {t:"endTurn"} : null;
        if (fb){ let e2 = localAct(seat, fb); if (e2 && fb.t === "endTurn" && S.phase === "main1") e2 = localAct(seat, {t:"toBattle"}); if (e2) console.warn("bot fallback refused:", err, "/", e2); }
      }
    }
    present(null, takeEv(S), () => { render(); pump(); });
  };
  botTimer = setTimeout(botStep, S.pending && S.pending.type === "respond" ? 550 : 750);
}
function newBotDuel(n,test=false){

  n = Math.max(2, Math.min(4, +n || ui.lastBotN || 2)); ui.lastBotN = n;
  ME = 0; OPP = 1; ui.match = "bot"; ui.userFocus = null; ui.focusTurn = -1;
  const mine = validateDeck(activeDeck().cards).ok ? activeDeck().cards : STARTER;
  const names = n === 2 ? ["You", "Bot"] : ["You", "Bot A", "Bot B", "Bot C"].slice(0, n);
  const heroes = [deckHero(activeDeck()), ...Array.from({length:n - 1}, () => HEROES[Math.floor(Math.random() * HEROES.length)])];
  S = newGame((Math.random() * 2 ** 31) | 0, names, [countsToList(mine), ...Array(n - 1).fill(DECK)], [countsToExtra(mine), ...Array(n - 1).fill(BOT_EXTRA)], heroes, null, false, test);

/* ---- attacking: pick the attackers first (long press a monster, tap allies to add them), then Attack, then the target ----

function attackParty(){ const m = ui.mode; return m && m.type === "attack" ? [monRef(ME, m.slot), ...(m.team || [])] : []; }

  if (e.target.id === "vol") Sound.setVol(+e.target.value / 100);

  if (e.target.id === "react"){ REACT = +e.target.value; try { localStorage.setItem("gatefall.react", REACT); } catch (er) {} const v = $("#reactV"); if (v) v.textContent = REACT + " s"; }
  if (e.target.id === "joinCode") e.target.value = e.target.value.toUpperCase().replace(/[^A-Z0-9]/g, "").slice(0, 4);
});
$("#bLog").addEventListener("click", () => openSheet({type:"log"}));
$("#bRules").addEventListener("click", () => openSheet({type:"rules"}));
$("#bSound").addEventListener("click", () => openSheet({type:"sound"}));
$("#bInstall").addEventListener("click", () => openSheet({type:"install"}));

/* ---- installable app & offline shell ---- */
function renderInstallBtn(){
  const b = $("#bInstall");
  if (b) b.hidden = PWA.installed || GF_CFG.app;
}
function setupPWA(){
  renderInstallBtn();
  addEventListener("beforeinstallprompt", e => {
    e.preventDefault();
    PWA.deferred = e;
    if (ui.sheet && ui.sheet.type === "install") renderSheet();
  });
  addEventListener("appinstalled", () => {
    PWA.installed = true;
    PWA.deferred = null;
    renderInstallBtn();
    if (ui.sheet && ui.sheet.type === "install") renderSheet();
    toast("Gatefall is installed and ready to play.");
  });
  const connectionChanged = () => {
    // back online without a room service yet (the page was opened offline): look again
    if (navigator.onLine && roomChecked && !RoomNS && !roomRetry){ roomRetry = detectRoomService().then(ns => { RoomNS = ns; roomRetry = null; renderLobby(); }).catch(() => { roomRetry = null; }); }
    if (ui.view === "lobby") renderLobby();
    if (ui.sheet && ui.sheet.type === "install") renderSheet();
  };
  addEventListener("online", connectionChanged);
  addEventListener("offline", connectionChanged);
  setupAppShell();
  if (GF_CFG.app || !GF_CFG.sw || !("serviceWorker" in navigator) || !/^https?:$/.test(location.protocol)) return;
  const register = () => navigator.serviceWorker.register(GF_CFG.sw, {scope:GF_CFG.sw.startsWith("/") ? "/" : "./"}).catch(() => {});
  if (document.readyState === "complete") register();
  else addEventListener("load", register, {once:true});
}

/* ---- app builds: hardware back button, invite links that open the app, pause in the background ---- */
function appBack(){
  if (ui.mode){ ui.mode = null; render(); return true; }
  if (ui.sheet){ if (!(S && S.pending && S.pending.player === ME && ui.view === "game")) closeSheet(); return true; }
  if (ui.view !== "menu"){ goMenu(); return true; }
  return false;
}
function openInvite(href){
  const code = roomFromUrl(href);
  if (!code || ui.match === "online") return;
  inviteRoom = code; showView("lobby"); renderLobby();
}
function setupAppShell(){
  const cap = typeof window !== "undefined" && window.Capacitor;
  if (!cap) return;
  let App = null;
  try { App = (cap.Plugins && cap.Plugins.App) || (typeof cap.registerPlugin === "function" ? cap.registerPlugin("App") : null); } catch (e) {}
  if (!App || typeof App.addListener !== "function") return;
  try {
    App.addListener("backButton", () => { if (!appBack()) App.exitApp(); });
    App.addListener("appUrlOpen", ev => openInvite(ev && ev.url));
    App.addListener("appStateChange", st => Sound.background(!(st && st.isActive)));
    if (typeof App.getLaunchUrl === "function") App.getLaunchUrl().then(r => r && r.url && openInvite(r.url)).catch(() => {});
  } catch (e) { console.warn("app hooks unavailable", e); }
}

/* ---- full screen ---- */
const FS_ON = `<svg viewBox="0 0 12 12" fill="currentColor" shape-rendering="crispEdges" aria-hidden="true"><path d="M1 1h4v1H2v3H1zM7 1h4v4h-1V2H7zM1 7h1v3h3v1H1zM10 7h1v4H7v-1h3z"/></svg>`;
const FS_OFF = `<svg viewBox="0 0 12 12" fill="currentColor" shape-rendering="crispEdges" aria-hidden="true"><path d="M4 1h1v4H1V4h3zM7 1h1v3h3v1H7zM1 7h4v4H4V8H1zM7 7h4v1H8v3H7z"/></svg>`;
const isFull = () => !!(document.fullscreenElement || document.webkitFullscreenElement);
function renderFullBtn(){
  const b = $("#bFull"); if (!b) return;
  const ok = HAS_DOM && (document.fullscreenEnabled || document.webkitFullscreenEnabled);
  b.hidden = !ok;
  b.innerHTML = isFull() ? FS_OFF : FS_ON;
  if (b.setAttribute) b.setAttribute("aria-label", isFull() ? "Exit full screen" : "Full screen");
}
async function toggleFull(){
  try {
    if (isFull()) await (document.exitFullscreen || document.webkitExitFullscreen).call(document);
    else {
      const el = document.documentElement, req = el.requestFullscreen || el.webkitRequestFullscreen;
      await req.call(el, {navigationUI:"hide"});
    }
  } catch (e){ toast("Full screen isn't available in this view."); }
  renderFullBtn();
}
$("#bFull").addEventListener("click", toggleFull);
// tapping the online bar re-syncs: unsticks the screen and asks everyone for missed moves
$("#netbar").addEventListener("click", () => {
  if (ui.match !== "online") return;
  ui.busy = false; ui.fxUntil = 0; fxChain = Promise.resolve();
  if (Net.gid) send({k:"sync", gid:Net.gid, n:Net.acts.length, r:Net.role, h:Net.hashes[Net.acts.length], bots:Net.role === "host" ? Net.bots : undefined});
  assertPresence(); render(); pump(); toast("Re-syncing with the room…");
});
document.addEventListener("fullscreenchange", renderFullBtn);
document.addEventListener("webkitfullscreenchange", renderFullBtn);
$("#bMenu").addEventListener("click", goMenu);
$("#bHome").addEventListener("click", goMenu);
function goMenu(){
  if (ui.view === "game" && S && (ui.match === "bot" || S.winner == null)){ openSheet({type:"leave"}); return; }
  if (ui.view === "game" && ui.match === "online"){ leaveOnline(); return; }
  if (ui.view === "lobby" && Net.role && !Net.gid) netClose(false);
  showView("menu");
}
document.addEventListener("pointerdown",e=>{
  const el=e.target.closest&&e.target.closest('[data-zone^="deck:"]');if(!el)return;
  const owner=+el.dataset.zone.split(":")[1];
  if(owner===ME&&S&&(S.drawWait||[]).includes(ME)&&!ui.sheet){ui.deckGesture={id:e.pointerId,x:e.clientX,y:e.clientY,el,done:false};try{if(navigator.vibrate)navigator.vibrate(12);}catch(er){}}
},true);
document.addEventListener("pointermove",e=>{
  const g=ui.deckGesture;if(!g||g.id!==e.pointerId||g.done)return;
  if(Math.hypot(e.clientX-g.x,e.clientY-g.y)>=22){g.done=true;ui.deckSuppress=Date.now()+600;manualDraw(g.el);}
},true);
document.addEventListener("pointerup",e=>{if(ui.deckGesture&&ui.deckGesture.id===e.pointerId)ui.deckGesture=null;},true);
document.addEventListener("pointercancel",()=>{ui.deckGesture=null;},true);
// browsers only allow audio after a tap, so the soundtrack starts on your first touch
document.addEventListener("pointerdown", e => {
  Sound.unlock();
  const t = e.target.closest && e.target.closest("[data-hand],.zone,.btn,.chip,.mbtn,.opt,.tg,.stepper button,.crow .thumb");
  if (!t || t.disabled) return;
  if (t.matches("[data-hand]")) Sound.play("card", 0, Math.random());
  else Sound.play("blip", 0, t.matches(".btn,.mbtn") ? .6 : Math.random() * .3);
}, true);
// big card follows your finger/mouse with a slight 3D tilt
document.addEventListener("pointermove", e => {
  const bc = e.target.closest && e.target.closest(".bc");
  if (!bc || REDUCED) return;
  const r = bc.getBoundingClientRect(), x = (e.clientX - r.left) / r.width - .5, y = (e.clientY - r.top) / r.height - .5;
  bc.style.setProperty("--ry", (x * 18).toFixed(1) + "deg"); bc.style.setProperty("--rx", (-y * 18).toFixed(1) + "deg");
});
document.addEventListener("pointerout", e => { const bc = e.target.closest && e.target.closest(".bc"); if (bc && !bc.contains(e.relatedTarget)){ bc.style.setProperty("--rx", "0deg"); bc.style.setProperty("--ry", "0deg"); } });
document.addEventListener("keydown", e => {
  Sound.unlock();
  if (e.key === "Escape"){
    if (ui.mode){ ui.mode = null; render(); }
    else if (ui.sheet && !(S && S.pending && S.pending.player === ME && ui.view === "game")) closeSheet();
  }
  if (e.key === "Enter" && e.target.id === "joinCode") document.querySelector('[data-net="join"]')?.click();
  if ((e.key === " " || e.key === "Enter" || e.key === "d" || e.key === "D") && ui.view === "game" && S && !ui.sheet && (S.drawWait || []).includes(ME) && !/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)){
    e.preventDefault(); manualDraw(document.querySelector(`.zone.pile[data-zone="deck:${ME}"]`));
  }
}, true);

/* ---- boot ---- */
function start(data){
  setupPWA();
  if (data && data.S && (!data.S.ffPos || data.S.layout === 2)) data = null;   // saved with a different board layout
  if (data && data.S && data.match === "bot"){ S = data.S; ui.match = "bot"; ME = 0; OPP = firstOpp(S, 0); ui.logSeen = S.logCount || 0; ui.endPlayed = S.winner != null; ui.prevLP = [P(S,0).lp, P(S,1).lp]; }
  renderSoundIcon();
  renderFullBtn();
  makeCardBack();
  initBackground();
  showView(inviteRoom ? "lobby" : data && data.view === "game" && S ? "game" : (data && data.view === "deck") ? "deck" : "menu");
  pump();
  initDeckSync();
  detectRoomService().then(ns => { RoomNS = ns; roomChecked = true; renderLobby(); });
}
window.claude?.hot?.snapshot?.(() => ({S: ui.match === "bot" ? S : null, match: ui.match === "bot" ? "bot" : null, view: ui.match === "online" ? "menu" : ui.view}));
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>
