/* Layout: one-column duel table floating over a slow, posterized pixel swirl, behind a CRT screen.
   Opponent mirrored on top, life "chips" in the middle (yours blue, theirs red), your field, chunky controls,
   then a gently swaying hand. One committed dark arcade look, so no light theme. */
:root{
  --bg:#0c1117; --ink:#fbf6ea; --muted:#a7b8c2; --outline:#14101f; --panel:#1a2230; --panel-2:#26324a; --panel-3:#33415e;
  --blue:#2f8cf2; --blue-d:#1b58a3; --red:#ef4a4a; --red-d:#9e2530; --gold:#f2b632; --gold-d:#a8711a; --green:#4fc46a; --green-d:#2a7d42;
  --f-monster:#e39a3b; --f-effect:#e2643a; --f-spell:#2fb39b; --f-trap:#c2509f; --parch:#f3ead2; --card-ink:#20172b;
  --display:"Jersey 10","Pixelify Sans",ui-monospace,monospace;
  --body:"Pixelify Sans",ui-monospace,"Courier New",monospace;
  --gap:5px;
  /* the duel screen fits one viewport: card width is the smaller of what the width allows
     and what the height allows (4 field rows + the hand = 5 card heights = 7 card widths, plus fixed chrome) */
  --vh:100vh;
  --chrome:calc(calc(216px + var(--topbar, 46px)) + env(safe-area-inset-top, 0px) + env(safe-area-inset-bottom, 0px));
  --zw:max(24px, min(calc((min(100vw, 600px) - 32px - 6 * var(--gap)) / 7), 92px, calc((var(--vh) - var(--chrome)) / var(--zdiv, 8.75)), var(--zcap, 999px)));
  --pw:calc(var(--zw) * .56);
  --hw:calc(var(--zw) * 1.2);
  --zh:calc(var(--zw) * 1.4);
  --notch:polygon(0 3px,3px 3px,3px 0,calc(100% - 3px) 0,calc(100% - 3px) 3px,100% 3px,100% calc(100% - 3px),calc(100% - 3px) calc(100% - 3px),calc(100% - 3px) 100%,3px 100%,3px calc(100% - 3px),0 calc(100% - 3px));
  --notch2:polygon(0 2px,2px 2px,2px 0,calc(100% - 2px) 0,calc(100% - 2px) 2px,100% 2px,100% calc(100% - 2px),calc(100% - 2px) calc(100% - 2px),calc(100% - 2px) 100%,2px 100%,2px calc(100% - 2px),0 calc(100% - 2px));
  --ts:0 2px 0 var(--outline);
  color-scheme:dark;
}
html,body{height:100%}
[hidden]{display:none!important}
@supports (height:100dvh){ :root{--vh:100dvh} }
body[data-ffa="1"]{--chrome:calc(calc(258px + var(--topbar, 46px)) + env(safe-area-inset-top, 0px) + env(safe-area-inset-bottom, 0px))}
body[data-online="1"]{--chrome:calc(calc(248px + var(--topbar, 46px)) + env(safe-area-inset-top, 0px) + env(safe-area-inset-bottom, 0px))}
body[data-view="game"]{overflow:hidden; --topbar:0px}
/* the sizes are worked out again on <body>, so the per-mode settings above (online bar, hunt strip, no top bar) really apply */
body{
  margin:0;
  --chrome:calc(216px + var(--topbar, 46px) + env(safe-area-inset-top, 0px) + env(safe-area-inset-bottom, 0px));
  --zw:max(24px, min(calc((min(100vw, 600px) - 32px - 6 * var(--gap)) / 7), 92px, calc((var(--vh) - var(--chrome)) / var(--zdiv, 8.75)), var(--zcap, 999px)));
  --pw:calc(var(--zw) * .56); --hw:calc(var(--zw) * 1.2); --zh:calc(var(--zw) * 1.4);
}
/* in a duel the header buttons leave the top: a rail on the side in landscape, tucked into the log line in portrait */
body[data-view="game"] .top .brand{display:none}
body[data-view="game"] .top{position:absolute; z-index:40; top:max(6px, env(safe-area-inset-top, 0px)); right:max(12px, env(safe-area-inset-right, 0px)); pointer-events:none}
body[data-view="game"] .top .links{pointer-events:auto; gap:4px}
body[data-view="game"] .top .chip{width:30px; height:28px; padding:0; display:grid; place-items:center}
body[data-view="game"] #bRules, body[data-view="game"] #bLog, body[data-view="game"] #bMenu{font-size:0}
body[data-view="game"] #bRules::before{content:"?"; font-size:17px}
body[data-view="game"] #bLog::before{content:"\2261"; font-size:19px}
body[data-view="game"] #bMenu::before{content:"\2302"; font-size:17px}
body[data-view="game"] #lastLog{padding-right:calc(5 * 34px)}
@media (orientation:landscape){
  body[data-view="game"] .top{position:fixed; top:50%; right:max(8px, env(safe-area-inset-right, 0px)); translate:0 -50%}
  body[data-view="game"] .top .links{flex-direction:column; gap:6px}
  body[data-view="game"] .top .chip{width:40px; height:36px}
  body[data-view="game"] #bRules::before, body[data-view="game"] #bMenu::before{font-size:20px} body[data-view="game"] #bLog::before{font-size:22px}
  body[data-view="game"] #lastLog{padding-right:0}
}
body[data-online="1"][data-ffa="1"]{--chrome:calc(calc(290px + var(--topbar, 46px)) + env(safe-area-inset-top, 0px) + env(safe-area-inset-bottom, 0px))}
body[data-view="game"] .app{height:100%; min-height:0; overflow:hidden}
#gameView{flex:1; min-height:0; justify-content:safe center}
body{
  background:var(--bg);
  background-image:radial-gradient(120% 70% at 50% 45%, #173a3c 0%, #11232b 45%, var(--bg) 80%);
  color:var(--ink); font-family:var(--body); font-size:15px;
  -webkit-tap-highlight-color:transparent; -webkit-font-smoothing:none;
}
#bg{position:fixed; inset:0; width:100%; height:100%; display:block; image-rendering:pixelated; z-index:0; pointer-events:none}
/* CRT: scanlines + vignette, above everything, never catches taps */
body::after{
  content:""; position:fixed; inset:0; z-index:50; pointer-events:none;
  background:
    repeating-linear-gradient(to bottom, rgba(0,0,0,.16) 0 1px, transparent 1px 3px),
    radial-gradient(120% 90% at 50% 50%, transparent 55%, rgba(0,0,0,.55) 100%);
}
#fx{position:fixed; inset:0; z-index:30; pointer-events:none; overflow:hidden}
#fx i{position:absolute; display:block}
.pop-num{position:absolute; font-family:var(--display); font-size:34px; line-height:1; text-shadow:0 3px 0 var(--outline), 0 0 0 var(--outline); -webkit-text-stroke:1px var(--outline); white-space:nowrap}
.pop-num.bad{color:var(--red)} .pop-num.good{color:var(--green)}

button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold); outline-offset:2px}
.app{
  position:relative; z-index:1;
  max-width:600px; margin:0 auto; min-height:100%; box-sizing:border-box;
  display:flex; flex-direction:column; gap:var(--gap);
  padding-block:8px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
}
.top{display:flex; align-items:center; justify-content:space-between; gap:8px}
.brand{background:none; border:0; padding:0; text-align:left; cursor:pointer; font-family:var(--display); font-size:26px; line-height:.9; letter-spacing:.04em; color:var(--gold); text-shadow:var(--ts)}
.brand small{display:block; font-family:var(--body); font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); text-shadow:none; margin-top:2px}
.top .links{display:flex; gap:6px}
.chip{
  background:var(--panel-2); border:0; color:var(--ink); padding:6px 10px 8px; font-family:var(--display); font-size:17px; line-height:1; cursor:pointer;
  clip-path:var(--notch2); box-shadow:inset 0 -3px 0 #151c2a; text-shadow:var(--ts);
}
.chip:hover{background:var(--panel-3)}
.chip:active{translate:0 1px; box-shadow:inset 0 -1px 0 #151c2a}
.chip:disabled{opacity:.4; cursor:default}
.icon-chip{display:grid; place-items:center; width:34px; height:30px; padding:0 0 2px}
.icon-chip svg{width:18px; height:18px; display:block}
#bInstall{color:var(--gold)}
body[data-view="game"] #bInstall{display:none}

/* ---------- board ---------- */
.opphand{display:flex; align-items:center; gap:3px; min-height:22px; justify-content:center}
.opphand .tb{width:13px; height:19px; background:var(--backimg, #7a1f3d) center/100% 100%; image-rendering:pixelated; box-shadow:inset 0 0 0 1px var(--outline)}
.opphand span{font-size:12px; color:var(--muted); margin-left:6px}

/* all monster, spell/trap, and side-pile zones use the same full-size columns */
.coop-lane{display:grid;gap:2px;justify-content:center}.coop-name{font:10px var(--display);color:var(--gold);text-align:center;line-height:1.1}.coop-row,.coop-strow{display:grid;grid-template-columns:var(--zw) repeat(7,var(--zw)) var(--zw);gap:var(--gap);justify-content:center;align-items:center}.coop-strow{position:relative}.coop-strow .zone.hero{--zbg:rgba(80,50,10,.32);--zline:rgba(242,182,50,.28)}.coop-strow .zone.st:nth-child(5)::after{content:"MID";position:absolute;bottom:-11px;left:50%;translate:-50% 0;font:8px var(--display);color:var(--gold);pointer-events:none}
.coop-name{display:flex;align-items:center;justify-content:center;gap:6px;max-width:100%;line-height:1.15}.coop-name>span{min-width:0;text-align:center}
.pile-solo{position:relative;width:var(--zw);height:var(--zh)}.pile-solo>.zone.pile{width:100%;height:100%}.partner-pile{position:absolute;top:50%;z-index:8;width:clamp(24px,calc(var(--zw) * .48),34px);aspect-ratio:5/7;padding:0;border:0;background:var(--panel);box-shadow:0 0 0 2px var(--gold);clip-path:var(--notch2);cursor:pointer;transform:translateY(-50%)}.pile-solo.extra>.partner-pile{right:calc(100% + 3px)}.pile-solo.deck>.partner-pile{left:calc(100% + 3px)}.pile-solo.flip.extra>.partner-pile{right:auto;left:calc(100% + 3px)}.pile-solo.flip.deck>.partner-pile{left:auto;right:calc(100% + 3px)}.partner-pile .back{position:absolute;inset:0;width:100%;height:100%}.partner-pile .partner-count{position:absolute;right:-3px;bottom:-3px;min-width:16px;padding:1px 3px 2px;background:var(--outline);color:var(--gold);font:11px var(--display);line-height:1;text-align:center;box-shadow:0 0 0 1px var(--gold)}.partner-pile:active{transform:translateY(calc(-50% + 2px))}.zone.banish{--zbg:rgba(55,24,76,.32);--zline:rgba(190,120,240,.28)}
.draw-ready{touch-action:none;position:relative;outline:3px solid var(--gold);animation:drawPulse .7s steps(2) infinite;z-index:6}.btn.draw-btn{outline:3px solid var(--gold);animation:drawPulse .7s steps(2) infinite}.draw-ready:active,.draw-ready.draw-pull{transform:translateY(5px) rotate(-3deg)}
.draw-hint{position:absolute;left:50%;top:-15px;translate:-50% 0;color:var(--gold);font:9px var(--display);white-space:nowrap;text-shadow:2px 2px #000;pointer-events:none}@keyframes drawPulse{50%{filter:brightness(1.45)}}body[data-coop="1"]{--zw:max(22px,min(calc((min(100vw,600px) - 96px - 8 * var(--gap)) / 9),66px,calc((var(--vh) - var(--chrome)) / var(--zdivc, 10.5)),var(--zcap, 999px)));--gap:3px}body[data-coop="1"] #myM{display:grid;grid-template-columns:minmax(0,1fr);gap:3px}body[data-coop="1"] #myST{display:block}body[data-coop="1"] #oppST,body[data-coop="1"] #oppM{grid-template-columns:var(--zw) repeat(7,var(--zw)) var(--zw);gap:var(--gap)}
.row{display:grid; grid-template-columns:var(--zw) repeat(5, var(--zw)) var(--zw); gap:var(--gap); justify-content:center}
.zone-gap{width:var(--pw)}
.zone{
  width:var(--zw); height:var(--zh); box-sizing:border-box; position:relative;
  border:0; background:none; display:grid; place-items:center; padding:0; cursor:pointer;
  -webkit-touch-callout:none; -webkit-user-select:none; user-select:none; touch-action:manipulation;
}
.zone::before{content:""; position:absolute; inset:0; pointer-events:none; clip-path:var(--notch);
  background:var(--zbg, rgba(8,12,20,.42)); box-shadow:inset 0 0 0 2px var(--zline, rgba(255,255,255,.08))}
.zone.st{--zbg:rgba(40,10,40,.30)}
.zone > .back, .zone > .lbl{position:relative}
.zone.pile{width:var(--zw); --zbg:rgba(0,0,0,.18); --zline:rgba(255,255,255,.05)}
.zone.pile > .mc, .zone.pile > .back{height:auto; aspect-ratio:5 / 7}
.zone.pile .mc .nm, .zone.pile .mc .st, .zone.pile .mc .tag{display:none}
.zone.pile .lbl{font-size:10px; letter-spacing:0}
.zone .cnt{position:absolute; bottom:-4px; right:-4px; z-index:2; background:var(--outline); color:var(--ink); font-family:var(--display); font-size:14px; line-height:1; padding:1px 4px 2px; font-variant-numeric:tabular-nums}
.zone .lbl{font-family:var(--display); font-size:13px; letter-spacing:.06em; text-transform:uppercase; color:rgba(255,255,255,.35)}
.zone.target::before{animation:blink .5s steps(2) infinite}
@keyframes blink{0%{box-shadow:inset 0 0 0 3px var(--red)}100%{box-shadow:inset 0 0 0 3px var(--gold)}}
.zone.sel::before{box-shadow:inset 0 0 0 3px var(--gold)}
.zone.ready::after{content:""; position:absolute; inset:0; z-index:1; box-shadow:inset 0 0 0 2px var(--gold); pointer-events:none; animation:breathe 1.6s steps(4) infinite}
@keyframes breathe{50%{opacity:.25}}
.zone.spot::before{box-shadow:inset 0 0 0 3px var(--gold); background:rgba(242,182,50,.16); animation:spot 1s steps(2) infinite}
.zone.spot .mc{opacity:.45}
@keyframes spot{50%{background:rgba(242,182,50,.32)}}
/* field cards get a hard pixel drop shadow from their slot */
.zone:not(.pile) > .mc, .zone:not(.pile) > .back{filter:drop-shadow(0 2px 0 rgba(0,0,0,.55))}

/* mini card */
.mc{
  width:100%; height:100%; min-width:0; min-height:0; overflow:hidden; box-sizing:border-box; padding:3px; position:relative;
  background:var(--frame,var(--f-monster)); display:flex; flex-direction:column; gap:2px;
  color:var(--ink); clip-path:var(--notch2);
  box-shadow:inset 0 0 0 2px var(--outline), inset 0 3px 0 2px rgba(255,255,255,.22), inset 0 -3px 0 2px rgba(0,0,0,.2);
  transition:transform .18s steps(3), opacity .2s;
}
.mc.k-effect{--frame:var(--f-effect)} .mc.k-spell{--frame:var(--f-spell)} .mc.k-trap{--frame:var(--f-trap)} .mc.k-xyz{--frame:#2b2838}
.els{position:absolute; top:2px; right:2px; z-index:5; display:flex; gap:2px; pointer-events:none}
.el{display:grid; place-items:center; width:15px; height:15px; box-sizing:border-box; border:1px solid #fbf6ea; border-radius:50%; background:var(--el); color:#14101f; font:11px/1 var(--display); text-shadow:0 1px 0 rgba(255,255,255,.45); box-shadow:0 0 0 1px #14101f}
.mc .nm{padding-right:calc(var(--elen, 0) * 17px)}
.bc .els{top:7px; right:7px; gap:3px}.bc .el{width:23px; height:23px; font-size:17px; border-width:2px}
.bc .bn{padding-right:calc(var(--elen, 0) * 26px)}
.backs.revealed{max-width:min(260px,45vw); gap:4px}.revealcard{width:34px; height:48px; padding:0; border:0; background:none; cursor:pointer}.revealcard .mc .nm,.revealcard .mc .st,.revealcard .mc .tag{display:none}.revealcard .el{width:10px;height:10px;font-size:7px}.revealcard .els{gap:0}
.savecode{width:100%; min-height:150px; resize:vertical; box-sizing:border-box; background:#0c1117; color:var(--ink); border:2px solid var(--outline); padding:10px; font:12px/1.4 monospace; overflow-wrap:anywhere}
.mc .nm{font-family:var(--display); font-size:11px; line-height:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; padding:1px 1px 0; text-shadow:0 1px 0 var(--outline); letter-spacing:.01em}
.mc .art{flex:1; min-height:0; overflow:hidden; background:#1d1630; box-shadow:inset 0 0 0 1px var(--outline)}
.mc .art img, .bc .art img{width:100%; height:100%; display:block; object-fit:cover; image-rendering:pixelated}
.mc .st{font-family:var(--display); font-size:13px; line-height:1; text-align:center; white-space:nowrap; overflow:hidden; font-variant-numeric:tabular-nums; padding:1px 0 2px; background:var(--outline); color:var(--ink)}
.mc .st i{font-style:normal; opacity:.55}
.mc .st.a{background:var(--red); box-shadow:inset 0 -2px 0 var(--red-d)}
.mc .st.d{background:var(--blue); box-shadow:inset 0 -2px 0 var(--blue-d)}
.mc .st.up{background:var(--green); box-shadow:inset 0 -2px 0 var(--green-d)}
/* monster Life Points: a badge in the art's bottom-right corner with a bar, on field monsters */
.mc .hp{position:absolute; right:3px; bottom:calc(3px + 1em + 4px); z-index:4; min-width:22px; padding:0 2px 1px; background:#123a22; color:#c9ffd6; font:11px/1 var(--display); text-align:right; font-variant-numeric:tabular-nums; box-shadow:inset 0 0 0 1px var(--outline); pointer-events:none}
.mc .hp::after{content:""; position:absolute; left:1px; right:1px; bottom:1px; height:2px; background:linear-gradient(90deg, var(--green) var(--hp, 100%), rgba(0,0,0,.55) 0)}
.mc .hp b{font-weight:400; position:relative; top:-1px}
.mc .hp.hurt{background:#3a3112; color:#ffe9a6}.mc .hp.hurt::after{background:linear-gradient(90deg, var(--gold) var(--hp), rgba(0,0,0,.55) 0)}
.mc .hp.low{background:#401418; color:#ffc0c0}.mc .hp.low::after{background:linear-gradient(90deg, var(--red) var(--hp), rgba(0,0,0,.55) 0)}
.zone.pile .mc .hp, .revealcard .mc .hp, .opt .thumb .mc .hp{display:none}
.zone .zhp{position:absolute; right:-3px; bottom:21px; z-index:6; min-width:20px; padding:0 3px 3px; background:#123a22; color:#c9ffd6; font:12px/1 var(--display); text-align:right; font-variant-numeric:tabular-nums; box-shadow:0 0 0 1px var(--outline), 0 2px 0 rgba(0,0,0,.4); pointer-events:none}
.zone .zhp::after{content:""; position:absolute; left:1px; right:1px; bottom:1px; height:2px; background:linear-gradient(90deg, var(--green) var(--hp, 100%), rgba(0,0,0,.6) 0)}
.zone .zhp.hurt{background:#3a3112; color:#ffe9a6}.zone .zhp.hurt::after{background:linear-gradient(90deg, var(--gold) var(--hp), rgba(0,0,0,.6) 0)}
.zone .zhp.low{background:#401418; color:#ffc0c0}.zone .zhp.low::after{background:linear-gradient(90deg, var(--red) var(--hp), rgba(0,0,0,.6) 0)}
.zone.pile .zhp{display:none}
.zone .dblb{position:absolute; left:-3px; bottom:21px; z-index:6; padding:0 3px 2px; background:#5a1a12; color:#ffd2a0; font:12px/1 var(--display); box-shadow:0 0 0 1px var(--outline), 0 0 0 2px #f08a3a, 0 2px 0 rgba(0,0,0,.4); pointer-events:none}
.mc .tag{font-family:var(--display); font-size:12px; line-height:1; letter-spacing:.08em; text-align:center; text-transform:uppercase; padding:1px 0 2px; background:var(--outline)}
.mc.def{transform:rotate(-90deg) scale(.714)}
.mc.used{opacity:.6; filter:saturate(.4)}
.mc.own-set{opacity:.78}
.mc.own-set::after{content:"SET"; position:absolute; top:40%; left:50%; translate:-50% -50%; font-family:var(--display); font-size:13px; background:var(--outline); color:var(--gold); padding:0 4px 1px}
.back{
  width:100%; height:100%; min-width:0; min-height:0; box-sizing:border-box; clip-path:var(--notch2);
  background:var(--backimg, #7a1f3d) center/100% 100%; image-rendering:pixelated;
  box-shadow:inset 0 0 0 2px var(--outline);
  transition:transform .18s steps(3);
}
.back.def{transform:rotate(-90deg) scale(.714)}

.btn.end{background:var(--gold); color:var(--outline); text-shadow:0 1px 0 rgba(255,255,255,.35); box-shadow:inset 0 -4px 0 var(--gold-d), inset 0 2px 0 rgba(255,255,255,.35)}
.waiting{font-size:14px; color:var(--muted)}
.waiting::after{content:"…"; animation:dots 1.2s steps(4) infinite; display:inline-block; width:1.2em; overflow:hidden; vertical-align:bottom}

/* the hand never scrolls: past 6 cards they overlap like a held fan */
.hand{display:flex; justify-content:center; padding:8px 0 8px; height:calc(var(--hw) * 1.4); box-sizing:content-box; width:calc(5 * var(--zw) + 2 * var(--pw) + 6 * var(--gap)); margin-inline:auto; max-width:100%}
.hand .slot{flex:0 0 var(--hw); width:var(--hw); min-width:0; height:calc(var(--hw) * 1.4); padding:0; border:0; background:none; cursor:pointer; filter:drop-shadow(0 4px 0 rgba(0,0,0,.5)); position:relative}
.hand .slot + .slot{margin-left:min(var(--gap), calc((100% - var(--n, 1) * var(--hw)) / (var(--n, 2) - 1)))}
.hand .slot .mc .nm{font-size:12px} .hand .slot .mc .st, .hand .slot .mc .tag{font-size:14px}
.hand .slot:hover, .hand .slot:focus-visible{z-index:3}
.atk-ghost{position:fixed; z-index:29; pointer-events:none; filter:drop-shadow(0 6px 0 rgba(0,0,0,.55))}
.atk-ghost > .mc, .atk-ghost > .back{width:100%; height:100%}
.impact{position:fixed; z-index:29; pointer-events:none; width:12px; height:12px; translate:-50% -50%; background:var(--ink); box-shadow:0 0 0 3px var(--gold), 0 0 0 6px var(--red)}
.hand .slot .mc{animation:sway 3.2s ease-in-out infinite; animation-delay:calc(var(--i, 0) * -.45s)}
.hand .slot.can .mc{transform:translateY(-6px); box-shadow:inset 0 0 0 2px var(--outline), inset 0 0 0 4px var(--gold), inset 0 -3px 0 4px rgba(0,0,0,.2)}
.hand .slot:hover .mc{transform:translateY(-9px) scale(1.04)}
@keyframes sway{0%,100%{rotate:-1.6deg; translate:0 0}50%{rotate:1.6deg; translate:0 -2px}}
.hand .empty{font-size:13px; color:var(--muted); align-self:center}
.netbar{font-size:13px; text-align:center; padding:5px 10px 6px; background:rgba(10,14,22,.65); clip-path:var(--notch2); color:var(--muted)}
.netbar.bad{color:var(--red)}
.dot{display:inline-block; width:8px; height:8px; background:var(--green); margin-right:6px; vertical-align:middle; animation:breathe 1.4s steps(2) infinite}
.netbar.bad .dot{background:var(--red)}

/* ---------- sheets ---------- */
.scrim{position:fixed; inset:0; z-index:20; background:rgba(6,8,14,.7); display:flex; align-items:flex-end; justify-content:center}
.sheet{
  width:min(560px,100%); max-height:88%; overflow:auto; box-sizing:border-box;
  background:var(--panel);
  box-shadow:inset 0 3px 0 var(--outline), inset 0 6px 0 var(--gold);
  clip-path:polygon(0 6px,6px 6px,6px 0,calc(100% - 6px) 0,calc(100% - 6px) 6px,100% 6px,100% 100%,0 100%);
  padding-top:20px; padding-bottom:calc(18px + env(safe-area-inset-bottom, 0px));
  padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px));
  display:flex; flex-direction:column; gap:12px; animation:rise .24s steps(5) both;
}
@keyframes rise{from{transform:translateY(40px)}}
.rtimer{position:relative; height:16px; background:var(--outline); clip-path:var(--notch2); box-shadow:inset 0 0 0 2px #2c3650}
.rtbar{position:absolute; left:0; top:0; bottom:0; background:var(--gold); box-shadow:inset 0 -3px 0 var(--gold-d); transition:width .1s linear}
.rtbar.low{background:var(--red); box-shadow:inset 0 -3px 0 var(--red-d); animation:breathe .5s steps(2) infinite}
.rtnum{position:absolute; right:6px; top:50%; translate:0 -50%; font-family:var(--display); font-size:15px; line-height:1; color:var(--ink); text-shadow:var(--ts)}
.sheet h2{margin:0; font-family:var(--display); font-weight:400; font-size:28px; line-height:1; color:var(--gold); text-shadow:var(--ts); text-wrap:balance}
.sheet p{margin:0; line-height:1.45; max-width:62ch}
.sheet .acts{display:flex; flex-wrap:wrap; gap:8px}
.sheet .acts .btn{flex:1 1 auto}
.sheet .hint{font-size:13px; color:var(--muted)}
.policy{display:flex; flex-direction:column; gap:8px}
.policy h1{margin:0; font-family:var(--display); font-weight:400; font-size:30px; line-height:1; color:var(--gold); text-shadow:var(--ts)}
.policy h2{margin:10px 0 0; font-family:var(--display); font-weight:400; font-size:22px; line-height:1; color:var(--teal, #2fb39b)}
.policy ul{margin:0; padding-left:1.2em} .policy li{margin:3px 0; line-height:1.4}
.policy .box{padding:8px 12px; border:2px solid rgba(255,255,255,.14)}
.policy .soft{color:var(--muted)} .policy .todo{background:rgba(242,182,50,.25); padding:0 3px}
.cardview{display:flex; gap:16px; align-items:flex-start; perspective:700px}
.cardview .side{flex:1 1 0; min-width:0; display:flex; flex-direction:column; gap:10px}
/* the card's text, large and easy to read, beside the card; a long text scrolls in its own box */
.sheet:has(.cardview){width:min(700px, 100%)}
.ctext{display:flex; flex-direction:column; gap:4px; max-height:min(44vh, 300px); overflow-y:auto; overscroll-behavior:contain; scrollbar-width:thin; padding:8px 10px 10px; background:rgba(0,0,0,.28); box-shadow:inset 0 0 0 2px rgba(255,255,255,.08); font-size:15px; line-height:1.45}
.ctext b{font-family:var(--display); font-weight:400; font-size:17px; line-height:1; color:var(--gold); text-shadow:var(--ts)}
.ctext p{margin:0}
.ctext .flav{font-style:italic; color:var(--muted)}
.ctext:focus-visible{outline:3px solid var(--gold); outline-offset:2px}
/* phones: a smaller card, so the text still fits beside it */
@media (max-width:520px){ .cardview{gap:10px} .cardview .bc{zoom:.74} .ctext{font-size:14px; max-height:min(36vh, 240px)} }
@media (max-width:330px){ .cardview{flex-wrap:wrap} }
.opts{display:flex; flex-direction:column; gap:6px}
.opt{display:flex; align-items:center; gap:10px; text-align:left; background:var(--panel-2); border:0; padding:6px 10px 8px 6px; cursor:pointer; clip-path:var(--notch2); box-shadow:inset 0 -3px 0 #151c2a}
.opt:hover{background:var(--panel-3)}
.opt.on{background:#4a3b1a; box-shadow:inset 0 0 0 2px var(--gold), inset 0 -3px 0 2px var(--gold-d)}
.opt .thumb{width:36px; height:50px; flex:0 0 36px}
.opt .thumb .mc .nm, .opt .thumb .mc .st, .opt .thumb .mc .tag{display:none}
.opt .t{display:flex; flex-direction:column; line-height:1.2; min-width:0; gap:2px}
.opt .t b{font-family:var(--display); font-weight:400; font-size:19px; line-height:1}
.opt .t small{color:var(--muted); font-size:12px}
.loglist{display:flex; flex-direction:column; gap:0; font-size:14px}
.loglist div{padding:5px 0; border-bottom:2px solid rgba(255,255,255,.06)}
.loglist .p1{color:#c6d4dc} .loglist .sys{color:var(--gold); font-family:var(--display); font-size:17px}

/* big card */
.bc{
  width:196px; flex:0 0 196px; box-sizing:border-box; padding:8px; position:relative;
  background:var(--frame,var(--f-monster)); color:var(--ink); display:flex; flex-direction:column; gap:6px;
  clip-path:var(--notch);
  box-shadow:inset 0 0 0 3px var(--outline), inset 0 5px 0 3px rgba(255,255,255,.22), inset 0 -5px 0 3px rgba(0,0,0,.22);
  transform:rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)); transition:transform .12s;
  animation:float 3s ease-in-out infinite;
}
@keyframes float{50%{translate:0 -5px}}
.bc.k-effect{--frame:var(--f-effect)} .bc.k-spell{--frame:var(--f-spell)} .bc.k-trap{--frame:var(--f-trap)} .bc.k-xyz{--frame:#2b2838}
.bc .lv i.rk{background:var(--outline); box-shadow:0 0 0 2px var(--gold), inset 0 0 0 2px #2b2838}
.bc .lv .rk-l{font-size:13px; color:var(--gold); margin-right:4px}
.mc.k-xyz, .bc.k-xyz{box-shadow:inset 0 0 0 2px var(--outline), inset 0 0 0 3px #a8711a, inset 0 3px 0 3px rgba(255,255,255,.12)}
.back.xb{background:
  radial-gradient(circle at 50% 50%, #f2c94c 0 9%, #14101f 10% 15%, transparent 16%),
  repeating-linear-gradient(45deg, #221c33 0 3px, #2e2645 3px 6px); box-shadow:inset 0 0 0 2px var(--outline), inset 0 0 0 3px #a8711a}
.orbit{position:absolute; left:50%; top:48%; width:0; height:0; z-index:4; pointer-events:none; scale:1 .5}
.orbit i{position:absolute; width:8px; height:8px; margin:-4px; background:var(--c); box-shadow:0 0 0 2px var(--outline), 0 0 8px 2px var(--c);
  animation:orbit 3.2s steps(32) infinite; animation-delay:calc(var(--k) * -3.2s / var(--n))}
@keyframes orbit{from{transform:rotate(0deg) translateX(calc(var(--zw) * .6)) rotate(0deg)} to{transform:rotate(360deg) translateX(calc(var(--zw) * .6)) rotate(-360deg)}}
.bc .bn{font-family:var(--display); font-size:22px; line-height:1; background:var(--outline); padding:3px 6px 5px; text-shadow:none}
.bc .lv{display:flex; justify-content:flex-end; gap:3px; min-height:12px; align-items:center; font-family:var(--display); font-size:16px; line-height:1; text-shadow:0 1px 0 var(--outline)}
.bc .lv i{width:8px; height:8px; background:var(--gold); box-shadow:0 0 0 2px var(--outline), inset -2px -2px 0 var(--gold-d); display:block}
.bc .art{height:120px; flex:0 0 auto; overflow:hidden; box-shadow:0 0 0 2px var(--outline); background:#1d1630}
/* every card has the same size (that of a monster with a short text); a long text scrolls inside its box */
.bc{height:310px}
.bc > *{flex:0 0 auto}
.bc .tx{background:var(--parch); color:var(--card-ink); padding:6px 7px 7px; font-size:13px; line-height:1.3; flex:1 1 0; min-height:0; overflow-y:auto; overscroll-behavior:contain; scrollbar-width:thin; scrollbar-color:var(--card-ink) transparent; box-shadow:inset 0 0 0 2px var(--outline)}
.bc .tx b{display:block; font-family:var(--display); font-weight:400; font-size:15px; line-height:1; margin-bottom:2px}
.bc .ad{display:flex; justify-content:flex-end; gap:5px; font-family:var(--display); font-size:17px; line-height:1; font-variant-numeric:tabular-nums}
.bc .ad span{flex:1; min-width:0; text-align:center; white-space:nowrap; padding:2px 3px 4px; text-shadow:var(--ts)}
.bc .ad .a{background:var(--red); box-shadow:inset 0 -3px 0 var(--red-d)}
.bc .ad .d{background:var(--blue); box-shadow:inset 0 -3px 0 var(--blue-d)}
.bc .ad .l{background:var(--green); box-shadow:inset 0 -3px 0 var(--green-d)}
.bc.facedown{background:var(--backimg, #7a1f3d) center/100% 100%; image-rendering:pixelated; padding:0; height:310px}

.toast{position:fixed; left:50%; bottom:calc(18px + env(safe-area-inset-bottom, 0px)); transform:translateX(-50%); z-index:31; background:var(--red); color:var(--ink); text-shadow:var(--ts); padding:8px 14px 10px; font-family:var(--display); font-size:19px; line-height:1.1; max-width:calc(100% - 32px); clip-path:var(--notch); box-shadow:inset 0 -4px 0 var(--red-d); animation:pop .35s steps(6) both}

.toggles{display:flex; flex-direction:column; gap:8px}
.tg{display:flex; align-items:center; justify-content:space-between; gap:12px; background:var(--panel-2); border:0; padding:10px 12px 12px; cursor:pointer; text-align:left; clip-path:var(--notch2); box-shadow:inset 0 -3px 0 #151c2a}
.tg b{font-family:var(--display); font-weight:400; font-size:20px}
.tg .sw{width:40px; height:22px; background:var(--outline); position:relative; flex:0 0 40px; clip-path:var(--notch2)}
.tg .sw::after{content:""; position:absolute; top:4px; left:4px; width:14px; height:14px; background:var(--muted); transition:transform .15s steps(3)}
.tg[aria-pressed="true"] .sw{background:var(--green-d)}
.tg[aria-pressed="true"] .sw::after{transform:translateX(18px); background:var(--ink)}
.vol{display:flex; align-items:center; gap:12px; padding:4px 2px}
.vol input{flex:1; accent-color:var(--gold)}

/* ---------- menu / lobby / deck views ---------- */
.view{display:flex; flex-direction:column; gap:var(--gap)}
/* ---- one screen, never a scrolling page ----
   The page itself never scrolls, on any device: the app fills the screen (inside the safe-area padding an
   embedded viewer adds), the open view gets the space under the header, and fitScreen() makes a view that
   would not fit smaller (the menu in compact steps, the duel with smaller cards). Long lists such as the
   card pool or the rules keep a scroll area of their own. */
html{box-sizing:border-box; height:100%; overflow:hidden; overscroll-behavior:none}
body{height:100%; overflow:hidden; overscroll-behavior:none}
.app{height:100%; min-height:0; overflow:hidden}
.view:not([hidden]){flex:1 1 auto; min-height:0}
#lobbyView, #huntView{overflow-y:auto; overflow-x:hidden; overscroll-behavior:contain}
#menuView{overflow:hidden}
#menuView .hero{flex:0 0 auto}
#menuView .mlist{flex:0 1 auto; min-height:0}
/* compact steps, applied one after another until the menu fits */
#menuView.fit1 .hero .fan{display:none}
#menuView.fit1 .hero{padding-block:10px 4px}
#menuView.fit2 .mlist{gap:7px}
#menuView.fit2 .mbtn{padding:9px 14px 12px}
#menuView.fit2 .hero .mark{font-size:clamp(40px, 12vw, 72px)}
#menuView.fit3 .mbtn small{display:none}
#menuView.fit3 .mlist{flex:1 1 auto; display:grid; grid-auto-rows:minmax(0, 1fr)}
#menuView.fit3 .hero-desc p{font-size:13px}
#menuView.fit4 .mlist{display:grid; grid-template-columns:1fr 1fr}
#menuView.fit4 .mbtn .go{display:none}
#menuView.fit4 .mbtn b{font-size:21px}
#menuView.fit5 .hero-desc p{display:none}
#menuView.fit5 .hero{display:flex; align-items:center; justify-content:space-between; padding-block:2px}
#menuView.fit5 .hero .mark{font-size:36px}
#menuView.fit5 .mbtn{padding:6px 10px 8px}
#menuView.fit5 .mbtn b{font-size:18px}
#menuView.fit5 .save-flop{width:36px; height:36px; padding:5px}
/* the duel: board and side (buttons + hand) are one column in portrait; side by side on wide, short screens */
#gameBoard, #gameSide{display:contents}
@media (orientation:landscape) and (max-height:560px){
  body[data-view="game"]{--zdiv:7.2; --chrome:calc(150px + env(safe-area-inset-top, 0px) + env(safe-area-inset-bottom, 0px))}
  body[data-view="game"][data-hunt="1"]{--zdiv:7.9}
  body[data-view="game"][data-coop="1"]{--zdivc:8.8}
  body[data-view="game"][data-ffa="1"]{--chrome:calc(192px + env(safe-area-inset-top, 0px) + env(safe-area-inset-bottom, 0px))}
  body[data-view="game"][data-online="1"]{--chrome:calc(182px + env(safe-area-inset-top, 0px) + env(safe-area-inset-bottom, 0px))}
  body[data-view="game"] .app{max-width:none; padding-right:calc(max(12px, env(safe-area-inset-right, 0px)) + 52px)}
  body[data-view="game"] #gameView{flex-direction:row; align-items:center; justify-content:center; gap:16px}
  body[data-view="game"] #gameBoard{display:flex; flex-direction:column; gap:var(--gap); flex:0 1 auto; min-width:0; max-height:100%}
  body[data-view="game"] #gameSide{display:flex; flex-direction:column; justify-content:center; gap:8px; flex:1 1 220px; min-width:190px; max-width:420px; max-height:100%}
  body[data-view="game"] #gameSide .hand{width:100%; --hw:calc(var(--zw) * 1.3)}
  body[data-view="game"] #gameSide .controls{justify-content:center}
}
/* wide and short screens (phones held sideways): title on the left, buttons in two columns on the right */
@media (orientation:landscape) and (max-height:560px){
  #menuView{display:grid; grid-template-columns:minmax(0, 1fr) minmax(0, 1.4fr); align-items:start; gap:10px 16px}
  #menuView .mlist{display:grid; grid-template-columns:1fr 1fr}
  #menuView .mbtn .go{display:none}
  body[data-view="menu"] .app{max-width:none}
}
.backrow{display:flex; align-items:center; justify-content:space-between; gap:8px; padding-top:6px}
.vtitle{margin:0; font-family:var(--display); font-weight:400; font-size:34px; line-height:1; color:var(--gold); text-shadow:0 3px 0 var(--outline)}

.hero .mark span{display:inline-block; animation:bob 1.8s steps(6) infinite; animation-delay:calc(var(--i) * -.18s)}

.hero .fan{display:flex; margin-top:20px; height:104px; padding-left:6px}
.hero .fan > div{width:66px; height:92px; margin-right:-20px; filter:drop-shadow(0 4px 0 rgba(0,0,0,.5)); animation:fanb 2.6s ease-in-out infinite; animation-delay:calc(var(--i) * -.5s)}
@keyframes fanb{50%{translate:0 -7px}}
.mlist{display:flex; flex-direction:column; gap:10px; padding-bottom:16px}
.mbtn{display:flex; align-items:center; gap:14px; width:100%; text-align:left; background:var(--panel-2); border:0; padding:14px 16px 17px; cursor:pointer; clip-path:var(--notch); box-shadow:inset 0 -4px 0 #151c2a, inset 0 2px 0 rgba(255,255,255,.08)}
.mbtn:hover{background:var(--panel-3)}
.mbtn:active{translate:0 2px}
.mbtn .t{flex:1; min-width:0; display:flex; flex-direction:column; gap:3px}

.mbtn.blue{background:var(--blue); box-shadow:inset 0 -5px 0 var(--blue-d), inset 0 2px 0 rgba(255,255,255,.25)}

.hero-desc{display:flex;align-items:center;justify-content:center;gap:12px}.hero-desc p{margin:0}

.save-flop:hover{background:#344b50;transform:translateY(-2px)}.save-flop svg{width:25px;height:25px;fill:currentColor}
.mbtn.blue small{color:#dcebff} .mbtn.blue .go{color:var(--ink)}
.warn{color:#ff8a7a} .ok{color:#7fe08f}
.panel{background:rgba(26,34,48,.92); clip-path:var(--notch); box-shadow:inset 0 0 0 2px rgba(255,255,255,.07); padding:14px 16px 16px; display:flex; flex-direction:column; gap:10px}

.status{font-size:14px; line-height:1.4}
.fine{font-size:13px; color:var(--muted); line-height:1.45; max-width:62ch; margin:0; text-shadow:0 1px 0 var(--outline)}
.deckbar{display:flex; flex-wrap:wrap; gap:8px; align-items:center}

.deckstats{display:flex; flex-wrap:wrap; gap:6px 12px; align-items:baseline; font-size:14px; color:var(--muted); font-variant-numeric:tabular-nums; text-shadow:0 1px 0 var(--outline)}
.deckstats .big{font-family:var(--display); font-size:40px; line-height:1; color:var(--ink); padding:0 10px 4px; background:var(--blue); clip-path:var(--notch2); box-shadow:inset 0 -4px 0 var(--blue-d); text-shadow:var(--ts)}
.deckstats .big.bad{background:var(--red); box-shadow:inset 0 -4px 0 var(--red-d)}
.inuse{font-family:var(--display); font-size:15px; line-height:1; letter-spacing:.06em; text-transform:uppercase; color:var(--outline); background:var(--green); padding:3px 8px 5px; clip-path:var(--notch2); box-shadow:inset 0 -3px 0 var(--green-d)}
.filters{display:flex; gap:6px; flex-wrap:wrap}
.heropick{display:grid; grid-template-columns:repeat(5, minmax(0,1fr)); gap:6px}
.hp{display:flex; flex-direction:column; gap:3px; align-items:stretch; padding:4px 4px 6px; border:0; cursor:pointer; background:var(--panel-2); clip-path:var(--notch2); box-shadow:inset 0 -3px 0 #151c2a; min-width:0}
.hp.on{background:#4a3b1a; box-shadow:inset 0 0 0 2px var(--gold), inset 0 -3px 0 2px var(--gold-d)}
.hpa{display:block; aspect-ratio:4 / 3; overflow:hidden; box-shadow:inset 0 0 0 1px var(--outline)}
.hpa img{width:100%; height:100%; object-fit:cover; image-rendering:pixelated; display:block}
.hpn{font-family:var(--display); font-size:14px; line-height:1; text-align:center; text-shadow:var(--ts); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.filters .chip[aria-pressed="true"]{background:var(--gold); color:var(--outline); text-shadow:none; box-shadow:inset 0 -3px 0 var(--gold-d)}
body[data-view="deck"]{overflow:hidden}
body[data-view="deck"] .app{height:100%; min-height:0; overflow:hidden}
@media (orientation:landscape){ body[data-view="deck"] .app{max-width:min(1400px, 100%)} }
#deckView{flex:1; min-height:0; display:flex; flex-direction:column; gap:5px; overflow:hidden}
#deckView .deckbar select{font-size:17px; padding:4px 8px 6px}
#deckView .deckbar .chip{font-size:14px; padding:4px 7px 6px}
.drow2{display:flex; gap:8px; align-items:center; min-width:0}
.drow2 .heropick{flex:1; min-width:0; gap:4px; flex-wrap:nowrap}
.drow2 .hp{flex:1 1 0; min-width:0}
.drow2 .hp{padding:2px 2px 3px; flex-direction:row; align-items:center; gap:3px}
.drow2 .hp .hpa{width:22px; height:22px; flex:none; overflow:hidden}
.drow2 .hp .hpa img{width:100%; height:100%; object-fit:cover}
.drow2 .hp .hpn{font-size:11px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.drow2 .deckstats{flex:none; gap:4px; font-size:11px; flex-direction:column; align-items:flex-end}
.drow2 .deckstats .big{font-size:22px; padding:0 6px 2px}
.dprob{margin:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.dedit{flex:1; min-height:0; display:grid; grid-template-columns:minmax(0,1fr); grid-template-rows:minmax(0,1fr) minmax(0,1.15fr); gap:6px}
@media (orientation:landscape){ .dedit{grid-template-columns:minmax(0,1fr) minmax(0,1fr); grid-template-rows:minmax(0,1fr)} }
.dpane, .ppane{background:rgba(16,22,34,.85); padding:5px; clip-path:var(--notch); box-shadow:inset 0 0 0 2px rgba(255,255,255,.06); min-width:0; min-height:0}
.dpane{overflow:hidden}
.ppane{display:flex; flex-direction:column; overflow:hidden}
.ppane .pgrid{flex:1; min-height:0; overflow-y:auto; align-content:start; padding:4px 3px 6px}
.dpane h3{margin:2px 2px 2px; font-family:var(--display); font-weight:400; font-size:13px; line-height:1; display:flex; justify-content:space-between; gap:6px}
.dpane h3 span{font-size:11px; color:var(--muted)}
.dpane{display:flex; flex-direction:column; overflow-y:auto; overflow-x:hidden}
.dgrid{display:grid; grid-template-columns:repeat(var(--dcols, 8), minmax(0,1fr)); gap:3px; min-height:12px; flex:none; align-content:start}
.pgrid{display:grid; grid-template-columns:repeat(auto-fill, minmax(clamp(56px, 9vmin, 96px), 1fr)); gap:5px}
.dt.k-monster{background:#e39a3b} .dt.k-effect{background:#e2643a} .dt.k-spell{background:#2fb39b} .dt.k-trap{background:#c2509f} .dt.k-xyz{background:#8b56d6}
.dgrid .dt{position:relative; padding:0; background:none}
.dgrid .dt .mc .nm{font-size:clamp(7px, calc(var(--dtw, 50px) * .14), 12px)}
.dgrid .dt .mc .st, .dgrid .dt .mc .tag{font-size:clamp(7px, calc(var(--dtw, 50px) * .15), 13px)}
.dgrid .dt .dn{position:absolute; right:-2px; top:calc(var(--dtw, 50px) * .2); z-index:2; background:var(--gold); color:var(--outline); font-family:var(--display); font-size:clamp(10px, calc(var(--dtw, 50px) * .2), 15px); line-height:1; padding:1px 3px 2px; box-shadow:0 0 0 1px var(--outline); pointer-events:none}
.dgrid .empty, .pgrid .empty{grid-column:1 / -1; font-size:12px; color:var(--muted); padding:6px 2px}
.dt, .pcard{padding:0; border:0; background:none; cursor:pointer; display:block; width:100%; aspect-ratio:5 / 7}
.dt .mc, .pcard .mc{height:100%}
.dt .mc .nm, .pt .mc .nm{font-size:8px}
.dt .mc .st, .dt .mc .tag, .pt .mc .st, .pt .mc .tag{font-size:8px}
.pt{position:relative; min-width:0}
.pt .pn{position:absolute; left:-2px; top:14px; z-index:2; background:var(--gold); color:var(--outline); font-family:var(--display); font-size:12px; line-height:1; padding:1px 4px 2px; box-shadow:0 0 0 1px var(--outline)}
.pt .padd{position:absolute; right:-2px; bottom:16px; z-index:2; width:20px; height:20px; padding:0; border:0; cursor:pointer; background:var(--blue); color:#fff; font-family:var(--display); font-size:16px; line-height:1; box-shadow:0 0 0 1px var(--outline), inset 0 -2px 0 var(--blue-d)}
.pt.locked .pcard{filter:grayscale(1)}
.lockc{height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; background:repeating-linear-gradient(45deg, #2a2140 0 4px, #1d1630 4px 8px); box-shadow:inset 0 0 0 1px var(--outline)}
.lockc span{font-size:16px} .lockc small{font-size:7px; line-height:1.1; color:var(--muted); text-align:center; padding:0 2px}
#poolQ{width:100%; box-sizing:border-box; font:inherit; font-size:15px; color:var(--ink); background:var(--outline); border:0; padding:6px 9px; margin-bottom:5px; flex:none; clip-path:var(--notch2); box-shadow:inset 0 0 0 2px #2c3650}
.ppane .filters{margin-bottom:5px; flex:none; gap:4px} .ppane .filters .chip{font-size:13px; padding:3px 6px 5px}
.psel{display:flex; gap:8px; margin-bottom:4px; flex-wrap:wrap; flex:none}
.ptools{flex:none}
@media (orientation:landscape){ .ptools{display:flex; flex-wrap:wrap; gap:0 8px; align-items:center} .ptools .filters, .ptools .psel{margin-bottom:3px} #poolQ{padding:4px 8px; margin-bottom:3px; font-size:14px} .dprob.ok{display:none} }
.psel label{display:flex; align-items:center; gap:4px; font-size:12px; color:var(--muted)}
.psel select{font:inherit; font-size:13px; color:var(--ink); background:var(--outline); border:0; padding:3px 4px; box-shadow:inset 0 0 0 1px #2c3650}
@media (max-width:360px){ .dedit{grid-template-columns:1fr} }
.clist{display:flex; flex-direction:column; gap:6px; padding-bottom:20px}
.crow{display:grid; grid-template-columns:46px minmax(0,1fr) auto; gap:10px; align-items:center; background:rgba(26,34,48,.9); padding:6px 8px 8px 6px; clip-path:var(--notch2); box-shadow:inset 0 -3px 0 rgba(0,0,0,.3)}
.crow.has{background:rgba(58,48,24,.92); box-shadow:inset 0 0 0 2px var(--gold-d), inset 0 -3px 0 2px rgba(0,0,0,.3)}
.crow .thumb{width:46px; height:64px; padding:0; border:0; background:none; cursor:pointer}
.crow .thumb .mc .nm, .crow .thumb .mc .st, .crow .thumb .mc .tag{display:none}
.crow .ci{display:flex; flex-direction:column; gap:2px; min-width:0}
.crow .ci b{font-family:var(--display); font-weight:400; font-size:20px; line-height:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; text-shadow:var(--ts)}
.crow .ci small{font-size:12.5px; color:var(--muted); display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden}
.crow .lim{color:var(--gold); font-family:var(--display); font-size:14px; line-height:1; letter-spacing:.06em; text-transform:uppercase}
.stepper{display:flex; align-items:center; gap:3px}
.stepper button{width:34px; height:34px; border:0; background:var(--panel-3); font-family:var(--display); font-size:26px; line-height:1; padding:0 0 4px; cursor:pointer; color:var(--ink); clip-path:var(--notch2); box-shadow:inset 0 -3px 0 #151c2a; text-shadow:var(--ts)}
.stepper button:active{translate:0 1px}
.stepper button:disabled{opacity:.3; cursor:default}
.stepper span{width:24px; text-align:center; font-family:var(--display); font-size:24px; line-height:1; font-variant-numeric:tabular-nums; text-shadow:var(--ts)}


/* card effect animations */
.fx-spr{position:fixed; image-rendering:pixelated; pointer-events:none; filter:drop-shadow(0 3px 0 rgba(0,0,0,.45))}
.fx-px{position:fixed; box-shadow:0 0 0 1px var(--outline)}
.fx-flash{position:fixed; inset:0; pointer-events:none; mix-blend-mode:screen}
.fx-clip{position:fixed; overflow:hidden; pointer-events:none}
.fx-drawc{overflow:visible; perspective:400px; z-index:62; filter:drop-shadow(0 6px 0 rgba(0,0,0,.45))}
.fx-drawc .dflip{position:absolute; inset:0; transform-style:preserve-3d}
.fx-drawc .dfront, .fx-drawc .dback{position:absolute; inset:0; backface-visibility:hidden; -webkit-backface-visibility:hidden}
.fx-drawc .dback{transform:rotateY(180deg)}
.fx-drawc .dfront > .mc, .fx-drawc .dfront > .back, .fx-drawc .dback > .back{width:100%; height:100%}
.fx-drawc .dfront .mc{box-shadow:0 0 0 2px #fff3ad, 0 0 16px 4px rgba(255,243,173,.6)}
.drawing{animation:deckPull .6s steps(6)}
@keyframes deckPull{0%,100%{transform:none}30%{transform:translateY(-6px) scale(1.06); filter:brightness(1.6)}}
.hand .slot.fresh{animation:freshCard 1.5s steps(6)}
@keyframes freshCard{0%,100%{filter:none}20%,60%{filter:brightness(1.5) drop-shadow(0 0 6px #fff3ad)}40%,80%{filter:brightness(1.1)}}
.fx-clip > .mc, .fx-clip > .back{width:100%; height:100%}
.fx-clip > .zbox{position:absolute; left:0}
.fx-clip > .zbox > .mc, .fx-clip > .zbox > .back{width:100%; height:100%}
.cutin{position:fixed; display:flex; flex-direction:column; align-items:center; gap:10px; pointer-events:none}
.cutin .bc{animation:none; transform:none; flex:0 0 auto; box-shadow:inset 0 0 0 3px var(--outline), inset 0 5px 0 3px rgba(255,255,255,.22), inset 0 -5px 0 3px rgba(0,0,0,.22), 0 0 0 4px var(--rc)}
.cutin-rays{position:absolute; left:50%; top:42%; width:520px; height:520px; margin:-260px 0 0 -260px; z-index:-1;
  background:repeating-conic-gradient(var(--rc) 0 9deg, transparent 9deg 18deg); opacity:.45;
  -webkit-mask:radial-gradient(circle, #000 18%, transparent 62%); mask:radial-gradient(circle, #000 18%, transparent 62%);
  animation:spinrays 6s steps(36) infinite}
@keyframes spinrays{to{rotate:360deg}}
.cutin-tag{font-family:var(--display); font-size:30px; line-height:1; padding:4px 16px 8px; color:var(--ink); text-shadow:var(--ts); background:var(--rc); clip-path:var(--notch); box-shadow:inset 0 -4px 0 rgba(0,0,0,.3); white-space:nowrap}
.fx-beam{position:fixed; pointer-events:none; transform-origin:50% 100%;
  background:linear-gradient(to right, transparent 0 8%, var(--bc) 8% 28%, #fffbe6 28% 72%, var(--bc) 72% 92%, transparent 92%);
  -webkit-mask:linear-gradient(to top, #000 55%, transparent); mask:linear-gradient(to top, #000 55%, transparent); opacity:.9}
.fx-jaw{position:fixed; pointer-events:none; background:#8b56d6; box-shadow:inset 0 0 0 3px var(--outline)}
.fx-jaw.top{clip-path:polygon(0 0,100% 0,100% 70%,90% 100%,80% 70%,70% 100%,60% 70%,50% 100%,40% 70%,30% 100%,20% 70%,10% 100%,0 70%)}
.fx-jaw.bot{clip-path:polygon(0 30%,10% 0,20% 30%,30% 0,40% 30%,50% 0,60% 30%,70% 0,80% 30%,90% 0,100% 30%,100% 100%,0 100%)}
.fx-orb{position:fixed; width:16px; height:16px; pointer-events:none; background:#c793ff; box-shadow:0 0 0 3px #8b56d6, 0 0 0 5px var(--outline), 0 0 16px 6px rgba(199,147,255,.6)}
.fx-ray{position:fixed; height:14px; transform-origin:0 50%; pointer-events:none;
  background:linear-gradient(to bottom, #ec4a5c 0 16%, #f08a3a 16% 33%, #f2c94c 33% 50%, #5fd06a 50% 66%, #4a90e2 66% 83%, #a070ea 83%)}
.fx-streak{position:fixed; height:3px; pointer-events:none; background:#dff6ff; box-shadow:0 1px 0 rgba(0,0,0,.4)}
.fx-pit{position:fixed; pointer-events:none; background:#0b0814; box-shadow:0 -3px 0 #4f331f, 0 0 0 3px #8a5a34; border-radius:50%; transform-origin:50% 50%}
.fx-glow{position:fixed; pointer-events:none; box-shadow:inset 0 0 0 3px var(--gold), 0 0 0 3px var(--gold-d)}
.fx-arrow{position:fixed; width:10px; height:12px; pointer-events:none; background:var(--green); clip-path:polygon(50% 0,100% 50%,70% 50%,70% 100%,30% 100%,30% 50%,0 50%)}
.fx-fire{position:fixed; width:16px; height:16px; pointer-events:none; background:#ffd36b; box-shadow:0 0 0 3px #f08a3a, 0 0 0 6px #e8553b, 0 0 0 8px var(--outline)}
.pop-num.flip{color:var(--gold)}
.pop-num.fx-small{font-size:22px}
.fx-hole{position:fixed; width:120px; height:120px; pointer-events:none}
.fx-hole .ring{position:absolute; inset:0; border-radius:50%;
  background:repeating-conic-gradient(#c793ff 0 14deg, #4d2d8a 14deg 28deg, #fbf6ea 28deg 34deg, #4d2d8a 34deg 48deg);
  -webkit-mask:radial-gradient(circle, transparent 36%, #000 38% 62%, transparent 64%); mask:radial-gradient(circle, transparent 36%, #000 38% 62%, transparent 64%);
  animation:spinrays 1.2s steps(12) infinite}
.fx-hole .core{position:absolute; inset:26%; border-radius:50%; background:#05030a; box-shadow:0 0 0 3px #14101f, 0 0 0 6px #8b56d6, 0 0 30px 10px rgba(80,30,140,.8)}
.fx-hole.galaxy .ring{background:repeating-conic-gradient(#f2c94c 0 10deg, #2a2440 10deg 24deg, #c793ff 24deg 32deg, #2a2440 32deg 46deg)}
.fx-hole.galaxy .core{background:#0d0a1a; box-shadow:0 0 0 3px var(--outline), 0 0 0 6px #f2c94c, 0 0 30px 10px rgba(242,201,76,.5)}
.fx-orb.gold{background:#ffe08a; box-shadow:0 0 0 3px #f2b632, 0 0 0 5px var(--outline), 0 0 16px 6px rgba(242,182,50,.6)}
.fx-stamp{position:fixed; pointer-events:none; font-family:var(--display); font-size:54px; line-height:1; color:var(--red); padding:4px 14px 8px; background:rgba(20,16,31,.85); box-shadow:inset 0 0 0 4px var(--red); text-shadow:0 3px 0 var(--outline); letter-spacing:.06em}
.fx-bubble{position:fixed; pointer-events:none; border-radius:50%; background:radial-gradient(circle, rgba(255,243,173,.08) 55%, rgba(255,243,173,.5) 62%, rgba(255,255,255,.9) 66%, transparent 68%)}
.phase-banner{position:fixed; inset:0; display:grid; place-items:center; pointer-events:none; background:rgba(6,8,14,.42)}
.pb-band{width:100%; box-sizing:border-box; padding:12px 16px 18px; text-align:center; display:flex; flex-direction:column; gap:2px;
  background:repeating-linear-gradient(90deg, var(--pb) 0 18px, var(--pb2) 18px 36px); box-shadow:0 4px 0 var(--outline), 0 -4px 0 var(--outline), inset 0 -6px 0 rgba(0,0,0,.25)}
.phase-banner.mine{--pb:#2f8cf2; --pb2:#2a7fe0} .phase-banner.theirs{--pb:#ef4a4a; --pb2:#dc4141}
.pb-who{font-size:13px; letter-spacing:.24em; text-transform:uppercase; color:#fbf6ea; text-shadow:0 2px 0 var(--outline)}
.pb-name{font-family:var(--display); white-space:nowrap; font-size:clamp(36px, 10.5vw, 80px); line-height:.95; color:#fbf6ea; text-shadow:0 4px 0 var(--outline), 0 8px 0 rgba(0,0,0,.3)}
.fx-wave{position:fixed; pointer-events:none; background:repeating-linear-gradient(45deg, rgba(239,74,74,.55) 0 8px, rgba(242,182,50,.45) 8px 16px)}
@keyframes dots{from{width:0}to{width:1.2em}}
@media (prefers-reduced-motion: reduce){
  *, *::before, *::after{animation:none !important; transition:none !important}
}
.top{min-width:0} .top .links{min-width:0; flex-shrink:1}
@media (max-width:420px){ .brand{font-size:22px} .brand small{display:none} .top .links{gap:4px} .chip{font-size:15px; padding:5px 7px 7px} .icon-chip{width:30px; height:27px} }
@media (max-width:380px){ .phases span{padding:4px 3px 5px} .lp .n{font-size:26px} .btn{font-size:19px; padding-inline:11px} }
/* ---- Monster Hunter bosses ---- */
.boss{position:relative; aspect-ratio:var(--bw) / var(--bh); height:100%; max-width:100%; margin-inline:auto; image-rendering:pixelated}
.boss .bl{position:absolute; inset:0; width:100%; height:100%; image-rendering:pixelated; pointer-events:none}
.boss{filter:drop-shadow(0 4px 0 rgba(0,0,0,.45))}
/* dragon: wings beat, head breathes, tail sways */
.b-cindermaw .bl-wingF{transform-origin:44% 46%; animation:mhdWingF 1.1s steps(6) infinite}
.b-cindermaw .bl-wingB{transform-origin:56% 42%; animation:mhdWingB 1.1s steps(6) infinite}
.b-cindermaw .bl-head{transform-origin:28% 40%; animation:mhdHead 2.2s steps(8) infinite}
.b-cindermaw .bl-tail{transform-origin:64% 60%; animation:mhdTail 2.6s steps(8) infinite}
.b-cindermaw .bl-body{animation:mhbob 1.1s steps(4) infinite}
@keyframes mhdWingF{0%,100%{transform:rotate(0) scaleY(1)}50%{transform:rotate(-12deg) scaleY(.72)}}
@keyframes mhdWingB{0%,100%{transform:rotate(0) scaleY(1)}50%{transform:rotate(10deg) scaleY(.75)}}
@keyframes mhdHead{0%,100%{transform:rotate(0)}50%{transform:rotate(-5deg) translateY(-2%)}}
@keyframes mhdTail{0%,100%{transform:rotate(0)}50%{transform:rotate(7deg)}}
@keyframes mhbob{0%,100%{transform:translateY(0)}50%{transform:translateY(-2.5%)}}
.b-cindermaw.st-def .bl-wingF{animation:none; transform:rotate(38deg) scaleX(.85) translate(-10%, 6%)}
.b-cindermaw.st-def .bl-wingB{animation:none; transform:rotate(-20deg) scaleY(.8)}
.b-cindermaw.st-def .bl-head{animation:mhdHead 3.4s steps(8) infinite; translate:6% 10%}
/* knight: cape flutters, sword sways; guarding raises the shield in front */
.b-morvane .bl-cape{transform-origin:50% 30%; animation:mhkCape 2s steps(6) infinite}
.b-morvane .bl-sword{transform-origin:78% 52%; animation:mhkSword 2.4s steps(8) infinite}
.b-morvane .bl-shield, .b-morvane .bl-body, .b-morvane .bl-head{animation:mhbob 2.4s steps(4) infinite}
@keyframes mhkCape{0%,100%{transform:skewX(0) scaleX(1)}50%{transform:skewX(-4deg) scaleX(1.04)}}
@keyframes mhkSword{0%,100%{transform:rotate(0)}50%{transform:rotate(6deg)}}
.b-morvane.st-def .bl-shield{animation:none; transform:translate(30%, -4%) scale(1.25); transition:transform .3s steps(4)}
.b-morvane.st-def .bl-sword{animation:none; transform:rotate(-38deg) translate(-6%, 8%)}
.b-morvane.st-def .bl-body, .b-morvane.st-def .bl-head, .b-morvane.st-def .bl-cape{animation:none; transform:translateY(4%) scaleY(.96)}
/* slime: wobbles; guarding flattens and hardens */
.b-gloop .bl-body, .b-gloop .bl-face, .b-gloop .bl-shine{transform-origin:50% 100%; animation:mhsWob 1.4s steps(6) infinite}
.b-gloop .bl-face{animation:mhsWob 1.4s steps(6) infinite, mhsBlink 4s steps(1) infinite}
@keyframes mhsWob{0%,100%{transform:scale(1, 1)}50%{transform:scale(1.06, .92)}}
@keyframes mhsBlink{0%,92%{opacity:1}94%{opacity:.2}96%,100%{opacity:1}}
.b-gloop.st-def .bl-body, .b-gloop.st-def .bl-face, .b-gloop.st-def .bl-shine{animation:mhsWob 2.6s steps(6) infinite; scale:1.08 .8; translate:0 10%}
.b-gloop.st-def .bl-body{filter:saturate(.6) brightness(.85) contrast(1.2)}
/* necromancer: floats, the staff orb pulses, ghost wisps rise */
.b-vexmora .bl-robe, .b-vexmora .bl-head, .b-vexmora .bl-staff{animation:mhfloat 2.6s steps(8) infinite}
.b-vexmora .bl-aura{animation:mhwisp 1.8s steps(6) infinite}
.b-vexmora .bl-staff{filter:drop-shadow(0 0 3px #7cff9a)}
@keyframes mhfloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-4%)}}
@keyframes mhwisp{0%{transform:translateY(0); opacity:.9}100%{transform:translateY(-14%); opacity:0}}
.b-vexmora.st-def .bl-staff{transform:rotate(-16deg) translate(-16%, -2%) scale(.92); transform-origin:78% 50%; animation:none}
.b-vexmora.st-def .bl-robe{animation:none; transform:scaleX(.92)}
.b-vexmora.st-def .bl-aura{animation:mhwisp 1s steps(6) infinite; filter:hue-rotate(40deg)}
/* hive queen: wings buzz, she hovers */

<script>
/* ===================== ENGINE =====================
   Deterministic: all randomness comes from S.rng, so two devices that apply the same
   actions in the same order stay in sync. That is what the phone version's Wi-Fi /
   Bluetooth link will send: one small action object per move. */

const GAME_VERSION = 51;
/* ---- platform: plain web page, Claude artifact, or an app build ----
   App builds (Android/iOS through Capacitor, Windows/macOS/Linux/Steam through Electron) are made by
   scripts/build-app.mjs, which sets window.GATEFALL_CONFIG: the platform, the server that relays online rooms
   (a running server.mjs), and the public web address used in invite links. The web version needs none of it:
   it talks to the server it was loaded from. */
const GF_CFG = (() => {
  const w = typeof window !== "undefined" ? window : {}, c = (w.GATEFALL_CONFIG && typeof w.GATEFALL_CONFIG === "object") ? w.GATEFALL_CONFIG : {};
  const clean = v => typeof v === "string" ? v.trim().replace(/\/+$/, "") : "";
  const cap = w.Capacitor, ua = typeof navigator !== "undefined" ? navigator.userAgent || "" : "";
  const shell = !!(cap && typeof cap.isNativePlatform === "function" && cap.isNativePlatform()) || /\bElectron\//.test(ua);
  const platform = ["web", "android", "ios", "desktop"].includes(c.platform) ? c.platform : "web";
  return {platform, app:platform !== "web" || shell, server:clean(c.server), webUrl:clean(c.webUrl), sw:typeof c.sw === "string" ? c.sw : "/sw.js"};
})();
// online rooms: same server as the page, or the configured one (cross-origin requests carry no cookies)
const roomsUrl = path => `${GF_CFG.server}/api/rooms/${path}`;
const ROOM_CREDS = GF_CFG.server ? "omit" : "same-origin";
const CARDS = {
  // ---- Duelist cards: one per player, behind the spell & trap row ----
  // SUMMON: every Duelist can step onto the field as a monster. If it leaves the field it goes back to its Duelist zone.
  // A Duelist on the field battles like any other monster.
  warden:    {name:"Ironheart Warden", kind:"hero", attr:"stone", pal:["#5b6678","#9aa7b8","#d8e0ea"], special:"heal1500", specialText:"gain 1500 LP",
              atk:2000, def:3000, sum:"trib2", sumText:"Tribute 2 monsters",
              text:"PASSIVE: Battle damage you take is halved. SPECIAL (once per duel, your Main Phase): gain 1500 LP. SUMMON (your Main Phase): Tribute 2 monsters to Special Summon this card as a 2000/3000 monster; If it would be destroyed, you can pay 1000 LP instead; if another card you control would be destroyed, it can destroy itself instead."},
  tactician: {name:"Ember Tactician", kind:"hero", attr:"ember", pal:["#9e2a2b","#e2643a","#ffa266"], special:"burn800", specialText:"deal 800 damage",
              atk:2400, def:1200, killBurn:true, meff:"grow500", sum:"trib1500", sumText:"Tribute 1 monster with 1500+ ATK",
              text:"PASSIVE: Your monsters gain 200 ATK during your turn. SPECIAL (once per duel, your Main Phase): inflict 800 damage to an opponent. SUMMON (your Main Phase): Tribute 1 face-up monster with 1500 or more ATK to Special Summon this card as a 2400/1200 monster; when it destroys a monster by battle, it inflicts 500 damage. On the field, once per turn: it gains 500 ATK."},
  scholar:   {name:"Tide Scholar", kind:"hero", attr:"tide", pal:["#24438f","#3d7fd9","#86ccff"], special:"gy2hand", specialText:"take back a monster",
              atk:0, def:0, atkHand:700, meff:"draw1", sum:"hand4", sumText:"hold 4+ cards, discard 1",
              text:"PASSIVE: In your Standby Phase, if you hold 2 or fewer cards, draw 1. SPECIAL (once per duel, your Main Phase): add 1 monster from your Graveyard to your hand. SUMMON (your Main Phase): if you hold 4 or more cards, discard 1 of them to Special Summon this card. Its ATK and DEF are ? : 700 for each card in your hand. On the field, once per turn: draw 1 card."},
  trickster: {name:"Gloam Trickster", kind:"hero", attr:"gloam", pal:["#4d2d8a","#8b56d6","#c793ff"], special:"destroyFD", specialText:"destroy a set card",
              atk:2200, def:1500, direct:true, meff:"heroShroud", quickEff:true, sum:"tribFD", sumText:"Tribute 1 face-down or weak monster",
              text:"PASSIVE: You can activate your traps the turn you set them. SPECIAL (once per duel, your Main Phase): destroy 1 face-down Spell or Trap an opponent controls. SUMMON (your Main Phase): Tribute 1 face-down monster, or 1 with 1000 or less ATK, to Special Summon this card as a 2200/1500 monster that can attack directly. On the field, Quick Effect (once per turn): change 1 other face-up monster (not a boss) to face-down Defense Position."},

  burglar:   {name:"Velvet Nyx, Cat Burglar", kind:"hero", attr:"gloam", pal:["#2a1f3d","#6a4fa0","#f2c94c"], special:"steal1", specialText:"steal a card",
              atk:2100, def:1500, kitty:true, sum:"tribKitty", sumText:"Tribute 1 Kitty monster",
              text:"PASSIVE: once per turn, when a Kitty monster you control deals battle damage to an opponent, steal 1 random card from that player's hand. SPECIAL (once per duel, your Main Phase): steal 1 random card from an opponent's hand. SUMMON (your Main Phase): Tribute 1 Kitty monster to Special Summon this card as a 2100/1500 monster. She counts as a Kitty herself."},

  yukicard: {name:"Yuki Onna", kind:"hero", attr:"tide", pal:["#31547e","#a9e6f2","#f4ffff"], special:"frost800", specialText:"freeze and inflict 800", atk:2100, def:2400, meff:"frostOne", quickEff:true, sum:"trib2", sumText:"Tribute 2 monsters", text:"PASSIVE: your opponent's monsters lose 200 ATK. SPECIAL (once per duel): inflict 800 damage and freeze 1 face-up monster. SUMMON: Tribute 2 monsters. Quick Effect (once per turn): freeze 1 face-up monster until the end of the next turn."},

function monArtCanvas(id){
  const key = "ma:" + id; if (SPRITE_CACHE[key]) return SPRITE_CACHE[key];
  const fn = MON_ART[id]; if (!fn) return null;
  const P = pxPainter(MA_W, MA_H); fn(P);
  let c;
  if (P.boss){
    const A = BOSS_ART[P.boss]; c = document.createElement("canvas"); c.width = MA_W; c.height = MA_H;
    const g = c.getContext("2d"); g.imageSmoothingEnabled = false;
    const sc = Math.min(MA_W / A.w, MA_H / A.h), w = Math.round(A.w * sc), h = Math.round(A.h * sc);
    const full = document.createElement("canvas"); full.width = A.w; full.height = A.h; const fg = full.getContext("2d");
    PX_RAW = true; try { for (const n of A.layers) fg.drawImage(A.draw(n), 0, 0); } finally { PX_RAW = false; }
    g.drawImage(full, Math.round((MA_W - w) / 2), MA_H - h, w, h);
  } else {
    const d = CARDS[id], mats = {...MA_MATS, b:PAL[d.attr] ? PAL[d.attr].slice() : MA_MATS.m, c:MA_CLOTH[d.attr] || MA_CLOTH.gloam};
    PX_RAW = true; try { c = pxCanvas(P, mats); } finally { PX_RAW = false; }
  }
  return SPRITE_CACHE[key] = c;
}

/* ===================== BOSS ART =====================
   Each boss is a few pixel-art layers painted from simple shapes (ellipses, polygons, lines) with
   automatic shading and a dark outline, so the parts (wings, sword, shield, staff...) can move on their own. */
const BOSS_ART_CACHE = {};
function pxPainter(w, h){
  const cells = new Array(w * h).fill(null);
  const set = (x, y, c) => { x = Math.round(x); y = Math.round(y); if (x >= 0 && y >= 0 && x < w && y < h) cells[y * w + x] = c; };
  const P = {
    w, h, cells, set,
    get(x, y){ return x >= 0 && y >= 0 && x < w && y < h ? cells[y * w + x] : null; },
    ell(cx, cy, rx, ry, c, keep){ for (let y = Math.floor(cy - ry); y <= cy + ry; y++) for (let x = Math.floor(cx - rx); x <= cx + rx; x++){ const dx = (x - cx) / rx, dy = (y - cy) / ry; if (dx * dx + dy * dy <= 1 && (!keep || keep(x, y))) set(x, y, c); } },
    rect(x, y, ww, hh, c){ for (let j = 0; j < hh; j++) for (let i = 0; i < ww; i++) set(x + i, y + j, c); },
    poly(pts, c){
      const ys = pts.map(p => p[1]), y0 = Math.floor(Math.min(...ys)), y1 = Math.ceil(Math.max(...ys));
      for (let y = y0; y <= y1; y++){
        const xs = [];
        for (let k = 0; k < pts.length; k++){ const [ax, ay] = pts[k], [bx, by] = pts[(k + 1) % pts.length]; if ((ay <= y + .5 && by > y + .5) || (by <= y + .5 && ay > y + .5)) xs.push(ax + (y + .5 - ay) * (bx - ax) / (by - ay)); }
        xs.sort((a, b) => a - b);
        for (let k = 0; k + 1 < xs.length; k += 2) for (let x = Math.ceil(xs[k] - .5); x <= Math.floor(xs[k + 1] - .5); x++) set(x, y, c);
      }
    },
    line(x0, y0, x1, y1, c, t = 1){
      const n = Math.max(Math.abs(x1 - x0), Math.abs(y1 - y0), 1);
      for (let k = 0; k <= n; k++){ const x = x0 + (x1 - x0) * k / n, y = y0 + (y1 - y0) * k / n; if (t <= 1) set(x, y, c); else P.ell(x, y, t / 2, t / 2, c); }
    },
    clear(fn){ for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) if (fn(x, y)) cells[y * w + x] = null; },
  };
  return P;
}

}
const overflowOf = el => el ? el.scrollHeight - el.clientHeight : 0;
function fitScreen(reset){
  if (!HAS_DOM) return;
  const app = document.getElementById("app"); if (!app) return;
  if (ui.view === "menu"){
    const mv = document.getElementById("menuView"); if (!mv || mv.hidden) return;
    for (let k = 1; k <= 5; k++) mv.classList.remove("fit" + k);

    return;

  if (ui.view === "lobby"){
    const lv = document.getElementById("lobbyView"); if (!lv || lv.hidden) return;

    const tight = () => overflowOf(hv) > 1 || [...hv.querySelectorAll(".htile .hart")].some(a => a.clientHeight < 40);
    for (let k = 1; k <= 3 && tight(); k++) hv.classList.add("fit" + k);
    return;
  }
  if (ui.view === "game"){
    const st = document.body.style;
    if (reset) st.removeProperty("--zcap");
    // smaller cards until the whole board fits; the fixed rows (bars, buttons) don't shrink, so measure again each step
    const gv = document.getElementById("gameView"), over = () => Math.max(overflowOf(app), overflowOf(gv));
    for (let n = 0; n < 8 && over() > 1; n++){

}

function animateLP(){

  const target = () => S ? [P(S,ME).lp, P(S,OPP).lp] : ui.prevLP;
  const tg = target();

  if (tg[0] === ui.prevLP[0] && tg[1] === ui.prevLP[1]){ draw(); return; }
  if (!HAS_DOM || REDUCED || typeof requestAnimationFrame !== "function"){ ui.prevLP = tg.slice(); draw(); return; }
  let last = 0, ticks = 0;
  const stepLP = ts => {
    const t = target(); let moving = false;
    for (const i of [0,1]){
      const diff = t[i] - ui.prevLP[i]; if (!diff) continue;
      moving = true;
      const s = Math.sign(diff) * Math.max(10, Math.round(Math.abs(diff) * .13 / 10) * 10);
      ui.prevLP[i] = Math.abs(s) >= Math.abs(diff) ? t[i] : ui.prevLP[i] + s;
    }
    draw();

function pickFocus(){
  if(S.coop){OPP=S.hunt?bossSeat(S):firstOpp(S,ME);renderTabs();return;}
  const prev = OPP;
  const pd = S.pending, mine = ui.focusTurn === S.turn && alive(S, ui.userFocus) && ui.userFocus !== ME;
  let f = OPP;
  if (mine) f = ui.userFocus;
  else if (pd && pd.player !== ME && alive(S, pd.player)) f = pd.player;
  else if (pd && pd.player === ME && pd.options && !pd.options.some(o => { const [k, a] = String(o.value).split(":"); return (k === "m" || k === "s") && +a === OPP; })){
    const o = pd.options.map(o => String(o.value).split(":")).find(([k, a]) => (k === "m" || k === "s") && +a !== ME && alive(S, +a)); if (o) f = +o[1];
  }
  else if (S.active !== ME && alive(S, S.active)) f = S.active;
  else if (S.event && S.event.k === "attack" && S.event.ai !== ME) f = S.event.ai;
  if (f === ME || !S.players[f] || (!alive(S, f) && S.winner == null)) f = firstOpp(S, ME);
  OPP = f;

}

function windowText(pd){
  const t = pd.trigger || {}, ev = S.event || {};

function ensureTimer(win){
  if (!HAS_DOM || (ui.rt && ui.rt.win === win)) return;
  stopTimer();
  const secs = reactSecs();
  ui.rt = {win, end:performance.now() + secs * 1000, secs, beep:99};
  ui.rt.iv = setInterval(() => {
    const rt = ui.rt; if (!rt) return;
    if (ui.busy){ rt.end += 100; return; }                       // the clock waits while an animation plays
    const left = (rt.end - performance.now()) / 1000;
    const bar = document.getElementById("rtBar"), num = document.getElementById("rtNum");
    if (bar){ bar.style.width = Math.max(0, left / rt.secs * 100) + "%"; bar.classList.toggle("low", left <= 3); }
    if (num) num.textContent = Math.max(0, Math.ceil(left));
    if (left <= 3 && Math.ceil(left) < rt.beep && left > 0){ rt.beep = Math.ceil(left); Sound.play("tick", 0, 1); Sound.play("blip", .05, 1); }
    if (left <= 0){
      stopTimer();
      if (S && S.pending && S.pending.type === "respond" && S.pending.player === ME && S.pending.win === win){ toast("Time's up. You passed."); dispatch({t:"respond", value:null}); }
    }
  }, 100);
}

function startPlace(action, kind, label){
  if (kind === "m" && action.t !== "set" && action.def == null && !action.forcePos){ openSheet({type:"summonPosition", action, kind, label}); return; }
  const p = P(S,ME), tributes = action.tributes || [],
    freed=new Set(tributes.map(x=>typeof x==="object"&&x?x.slot:typeof x==="string"&&x.includes(":")?+x.split(":")[1]:+x));
  let allowed;
  if (kind === "m"){
    allowed = (p.m.length>=9?[0,1,2,3,4,7,8]:[0,1,2,3,4]).filter(k => (!p.m[k]||freed.has(k))&&(!sharedField(S)||!paired(S,ME)||teamSeats(S,ME).every(j=>j===ME||!P(S,j).m[k]||freed.has(k))));
    if (!p.m[FF] || freed.has(FF)) allowed.push(...(S.ffPos[ME] != null ? [S.ffPos[ME]] : ffFreePos(S, ME)).map(q => FFZ + q));
  } else allowed = p.st.map((_, k) => k).filter(k => !p.st[k]);
  if (allowed.length <= 1){ dispatch({...action, zone:allowed[0]}); return; }
  ui.mode = {type:"place", kind, action, allowed, label, tributes:tributes.length > 0};
  ui.sheet = null; render();
}

   Everything is synthesized live with Web Audio, no audio files: pulse waves (12.5/25/50% duty),
   a triangle bass and noise drums, like an old handheld. Three songs, one per screen: a laid-back menu
   theme in D minor, a slow calm piece for the deck editor, and a driving battle theme for duels that

const Sound = (() => {
  const prefs = {music:true, sfx:true, vol:0.7, banners:true, splitField:false};
  try { Object.assign(prefs, JSON.parse(localStorage.getItem("gatefall.sound") || "{}")); } catch (e) {}

    return ctx.createPeriodicWave(re, im);
  }

    try { ctx = new C(); } catch (e) { return false; }
    const comp = ctx.createDynamicsCompressor(); comp.threshold.value = -14; comp.ratio.value = 3; comp.connect(ctx.destination);
    master = ctx.createGain(); master.gain.value = prefs.vol; master.connect(comp);
    musicBus = ctx.createGain(); musicBus.gain.value = prefs.music ? .5 : 0; musicBus.connect(master);
    sfxBus = ctx.createGain(); sfxBus.gain.value = prefs.sfx ? .75 : 0; sfxBus.connect(master);
    song = ctx.createGain(); song.gain.value = 1; song.connect(musicBus);
    drumBus = ctx.createGain(); drumBus.gain.value = 0; drumBus.connect(song);
    // short tape-style echo instead of reverb: dotted-eighth repeats, darkened each pass
    const dl = ctx.createDelay(1), fb = ctx.createGain(), lp = ctx.createBiquadFilter();
    echoDelay = dl; dl.delayTime.value = sps() * TRACKS[track].echo; fb.gain.value = .3; lp.type = "lowpass"; lp.frequency.value = 2200;
    dl.connect(lp); lp.connect(fb); fb.connect(dl); lp.connect(master);
    musicSend = ctx.createGain(); musicSend.gain.value = prefs.music ? .22 : 0; musicSend.connect(dl);
    sfxSend = ctx.createGain(); sfxSend.gain.value = prefs.sfx ? .18 : 0; sfxSend.connect(dl);
    waves.p12 = pulse(.125); waves.p25 = pulse(.25); waves.p50 = pulse(.5);
    noiseBuf = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate);
    const nd = noiseBuf.getChannelData(0); for (let k = 0; k < nd.length; k++) nd[k] = Math.random() * 2 - 1;

    return true;

  function voice({t, f, dur, type = "p25", g = .1, a = .003, r = .05, cut = null, q = .7, bus, send = null, glideTo = null}){

        voice({t, f:mtof(note), dur:d * len * .85, type:"p25", g:.06, a:.004, r:.1, cut:4800, bus:song, send:musicSend});
        voice({t, f:mtof(note - 12), dur:d * len * .8, type:"p50", g:.02, r:.08, cut:1800, bus:song});
      }
      if (st === 0) noise({t, dur:.5, g:.05, type:"highpass", f:6000, bus:song});
      if (st === 4 || st === 12) noise({t, dur:.1, g:.22, type:"bandpass", f:2000, q:.7, bus:song});
      if (bar === 7 && st >= 12) noise({t, dur:.05, g:.18, type:"bandpass", f:2400, q:.8, bus:song});
      if (st === 0 || st === 8) kick(t, .55, song);
    }},
    defeat: {bpm:60, len:256, echo:4, play(s, t, d){
      const bar = Math.floor(s / 16) % 8, pass = Math.floor(s / 128), st = s % 16, B = FALL_BARS[bar], c = B.c;
      if (st === 0){
        voice({t, f:mtof(B.b - 12), dur:d * 15, type:"triangle", g:.2, a:.25, r:.8, bus:song});
        for (const m of c) voice({t, f:mtof(m - 12), dur:d * 14, type:"p50", g:.012, a:.6, r:1, cut:700, bus:song});
      }
      if (st === 8) voice({t, f:mtof(B.b - 5), dur:d * 7, type:"triangle", g:.1, a:.1, r:.5, bus:song});
      if (pass > 0 || bar >= 2) for (const [ms, note, len] of FALL_MEL[bar]) if (ms === st){
        voice({t, f:mtof(note), dur:d * len * .5, type:"triangle", g:.11, a:.004, r:.9, bus:song, send:musicSend});
        voice({t, f:mtof(note + 12), dur:d * .4, type:"p12", g:.012, r:.5, bus:song, send:musicSend});
      }
      if (st === 4 || st === 12) noise({t, dur:.4, g:.012, type:"bandpass", f:500, q:.8, bus:song});
    }},
    duel: {bpm:138, len:512, echo:3, play(s, t, d){
      const bar = Math.floor(s / 16) % 16, pass = Math.floor(s / 256), st = s % 16, B = DUEL_BARS[bar], c = B.c;
      // galloping bass: 8th + two 16ths
      if (st % 4 !== 1){
        const oct = st === 8 || st === 14 ? 12 : 0;
        voice({t, f:mtof(B.b + oct), dur:d * .8, type:"triangle", g:.3, a:.002, r:.03, bus:song});
        voice({t, f:mtof(B.b + oct + 12), dur:d * .6, type:"p50", g:.035, r:.03, cut:900, bus:song});
      }
      // 3-3-2 chord stabs
      if (st === 0 || st === 6 || st === 12)
        for (const m of c) voice({t, f:mtof(m), dur:d * (st === 12 ? 1.5 : 2.2), type:"p25", g:.03, r:.06, cut:2600, bus:song, send:st === 12 ? musicSend : null});
      // the lead comes in on the second half of the first pass and stays from then on
      if (pass > 0 || bar >= 8) for (const [ms, note, len] of DUEL_MEL[bar]) if (ms === st)
        voice({t, f:mtof(note), dur:d * len * .85, type:"p25", g:.05, a:.004, r:.07, cut:4200, bus:song, send:musicSend});
      // always-on pulse: kick and offbeat hat
      if (st === 0 || st === 8 || (st === 10 && bar % 2 === 1)) kick(t, .7, song);
      if (st % 4 === 2) noise({t, dur:.03, g:.06, type:"highpass", f:8000, bus:song});
      // Battle Phase layer
      if (st === 3 || st === 11) kick(t, .55, drumBus);
      if (st === 4 || st === 12) noise({t, dur:.14, g:.45, type:"bandpass", f:2000, q:.6, bus:drumBus});
      if (st % 2 === 1) noise({t, dur:.02, g:.09, type:"highpass", f:9000, bus:drumBus});
      if (bar % 4 === 3 && st >= 12) voice({t, f:[220, 180, 150, 120][st - 12], glideTo:70, dur:.1, type:"triangle", g:.45, r:.05, bus:drumBus});
      const up = [c[0], c[1], c[2], c[0] + 12];
      voice({t, f:mtof(up[st % 4] + 12 + (st >= 8 ? 12 : 0)), dur:.03, type:"p12", g:.02, r:.04, bus:drumBus, send:st % 4 === 3 ? musicSend : null});
    }},
  };
  let track = "menu", song = null, echoDelay = null, swapTimer = null;
  const sps = () => 60 / TRACKS[track].bpm / 4;
  function tick(){
    const T = TRACKS[track], d = sps();
    while (nextT < ctx.currentTime + .12){ T.play(step, nextT, d); nextT += d; step = (step + 1) % T.len; }
  }
  function startMusic(){ if (!init() || timer) return; ctx.resume(); step = 0; nextT = ctx.currentTime + .08; timer = setInterval(tick, 30); }
  function stopMusic(){ clearInterval(timer); timer = null; }
  // fade out, change song at the start of a fresh loop, fade back in

    if (!TRACKS[name] || name === track && !swapTimer) return;

      swapTimer = null; track = name; step = 0;

  // ---- effects ----

    summon: t => { [0,4,7,12,16].forEach((s, k) => voice({t:t + k * .045, f:mtof(62 + s), dur:.035, type:"p25", g:.085, r:.05, bus:sfxBus, send:sfxSend})); voice({t, f:mtof(38), dur:.18, type:"triangle", g:.4, r:.08, bus:sfxBus}); },
    set: t => { voice({t, f:mtof(52), dur:.04, type:"p50", g:.07, r:.03, bus:sfxBus}); voice({t:t + .06, f:mtof(45), dur:.06, type:"p50", g:.07, r:.05, bus:sfxBus}); noise({t:t + .06, dur:.05, g:.15, type:"lowpass", f:900, bus:sfxBus}); },
    attack: t => { noise({t, dur:.22, g:.26, type:"bandpass", f:500, fTo:4200, q:1.6, bus:sfxBus}); voice({t, f:950, glideTo:200, dur:.2, type:"p12", g:.065, r:.04, bus:sfxBus}); },
    hit: t => { voice({t, f:170, glideTo:42, dur:.22, type:"p50", g:.14, cut:1500, r:.08, bus:sfxBus}); noise({t, dur:.2, g:.34, type:"lowpass", f:2000, fTo:260, bus:sfxBus}); },
    destroy: t => { noise({t, dur:.42, g:.3, type:"lowpass", f:4200, fTo:180, q:.7, bus:sfxBus}); [74,69,65,60,55].forEach((m, k) => voice({t:t + k * .045, f:mtof(m), dur:.035, type:"p25", g:.065, r:.04, bus:sfxBus})); },
    trap: t => { for (let k = 0; k < 5; k++) voice({t:t + k * .085, f:k % 2 ? 622 : 932, dur:.065, type:"p50", g:.065, r:.02, bus:sfxBus, send:sfxSend}); },

    wind: t => { noise({t, dur:.7, g:.28, type:"bandpass", f:400, fTo:1800, q:2.5, bus:sfxBus}); noise({t:t + .25, dur:.5, g:.18, type:"bandpass", f:1800, fTo:500, q:2.5, bus:sfxBus}); },

    shield: t => { voice({t, f:mtof(88), dur:.03, type:"p25", g:.07, r:.3, bus:sfxBus, send:sfxSend}); voice({t:t + .05, f:mtof(95), dur:.03, type:"triangle", g:.1, r:.4, bus:sfxBus, send:sfxSend}); },
    rainbow: t => [72,76,79,84,88,91,96,100].forEach((m, k) => voice({t:t + k * .03, f:mtof(m), dur:.025, type:"p25", g:.06, r:.08, bus:sfxBus, send:sfxSend})),

    xyz: t => { [57, 60, 64, 67, 71, 74, 76, 79].forEach((m, k) => voice({t:t + k * .09, f:mtof(m), dur:.08, type:"p25", g:.07, r:.2, bus:sfxBus, send:sfxSend})); noise({t, dur:1.1, g:.22, type:"bandpass", f:300, fTo:4000, q:2, bus:sfxBus}); voice({t:t + .8, f:55, glideTo:110, dur:.5, type:"triangle", g:.35, r:.2, bus:sfxBus}); },
    hole: t => { voice({t, f:220, glideTo:30, dur:1.6, type:"p50", g:.12, cut:700, r:.3, bus:sfxBus}); noise({t, dur:1.6, g:.4, type:"bandpass", f:3000, fTo:120, q:3, bus:sfxBus}); voice({t:t + .2, f:110, glideTo:27, dur:1.4, type:"triangle", g:.35, r:.3, bus:sfxBus}); },
    horn: t => { [50, 57, 62].forEach((m, k) => voice({t:t + k * .02, f:mtof(m), dur:.5, type:"p50", g:.06, a:.04, cut:1600, r:.3, bus:sfxBus, send:sfxSend})); [62, 66, 69, 74].forEach((m, k) => voice({t:t + .5 + k * .09, f:mtof(m), dur:.09, type:"p25", g:.07, r:.12, bus:sfxBus, send:sfxSend})); noise({t, dur:1.1, g:.12, type:"bandpass", f:1200, q:.5, bus:sfxBus}); },
    powerup: t => [60,64,67,72,76,79,84].forEach((m, k) => voice({t:t + k * .04, f:mtof(m), dur:.03, type:"p12", g:.07, r:.05, bus:sfxBus})),
    win: t => [62,66,69,74,78,81,86,90].forEach((m, k) => voice({t:t + k * .085, f:mtof(m), dur:.07, type:"p25", g:.085, r:k === 7 ? .5 : .12, bus:sfxBus, send:sfxSend})),
    lose: t => [69,68,67,66,62,57,50].forEach((m, k) => voice({t:t + k * .15, f:mtof(m), dur:.12, type:"p50", g:.055, cut:1800, r:.12, bus:sfxBus})),
  };
  function play(name, delay = 0, p = 0){ if (!ctx || !prefs.sfx || ctx.state !== "running" || !FX[name]) return; try { FX[name](ctx.currentTime + .01 + delay, p); } catch (e) {} }

  return {
    prefs, play,
    unlock(){ if (!(prefs.music || prefs.sfx)) return; if (!init()) return; if (ctx.state !== "running") ctx.resume(); if (prefs.music) startMusic(); },
    setTrack(name){ setTrack(name); if (name !== "duel") this.setIntensity(0); },
    get track(){ return track; },
    setIntensity(x){ if (!ctx || x === intensity) return; intensity = x; drumBus.gain.setTargetAtTime(x ? .8 : 0, ctx.currentTime, .5); },
    setMusic(on){ prefs.music = on; save(); if (!init()) return; musicBus.gain.setTargetAtTime(on ? .5 : 0, ctx.currentTime, .15); musicSend.gain.setTargetAtTime(on ? .22 : 0, ctx.currentTime, .15); if (on){ ctx.resume(); startMusic(); } else setTimeout(() => { if (!prefs.music) stopMusic(); }, 600); },
    setSfx(on){ prefs.sfx = on; save(); if (!init()) return; ctx.resume(); sfxBus.gain.value = on ? .75 : 0; sfxSend.gain.value = on ? .18 : 0; },
    setVol(v){ prefs.vol = v; save(); if (ctx) master.gain.setTargetAtTime(v, ctx.currentTime, .05); },

    background(off){ if (!ctx) return; if (off) ctx.suspend(); else if (prefs.music || prefs.sfx) ctx.resume(); },
    get running(){ return !!ctx && ctx.state === "running"; },
  };
})();
